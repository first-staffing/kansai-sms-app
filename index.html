<script>
/* ===== 追補7: 15社割当・FS履歴・接触管理データ拡張（ダミー） =====
 判定の正: 掘り起こし対象 = 応募履歴(history)に source_company=ファーストスタッフィング が1件以上。
 history は {at,kind,detail,company} を持つよう拡張する。最新応募が他社でも過去FSがあれば対象。 */
applicants.forEach((a,i)=>{a.history=a.history.map(h=>({...h,company:h.company||a.source_company}));a.last_contact_at=a.last_contact_at||(a.sms_sent?"2026-11-18":"");a.next_contact_date=a.next_contact_date||"";});
const EXTRA_CO=["ラブキャリア","株式会社カナミックネットワーク","グローバルヒューマンブリッジ(1)","キカリ紹介事業部","株式会社NEXTスタッフサービス","サンレディース","カナミック","株式会社グローバルヒューマンブリッジ","グラスト","ジョブコレ大阪株式会社-コピー","株式会社ビースタイルスマートキャリア","キャストウェル"];
applicants.forEach((a,i)=>{if(i%3===2){a.source_company=EXTRA_CO[i%EXTRA_CO.length];a.history[a.history.length-1].company=a.source_company}});
/* デモ用: 最新は他社だが過去にFS応募あり → 掘り起こしタブでのみ拾える人 */
function addFsPast(id,when){const a=applicants.find(x=>x.id===id);if(a)a.history.push({at:when,kind:"応募",detail:"ファーストスタッフィング 経由で応募（過去）",company:"ファーストスタッフィング"})}
addFsPast("A0002","2025-06-10T10:00");addFsPast("A0008","2025-03-15T10:00");addFsPast("A0010","2024-11-01T10:00");addFsPast("A0014","2025-08-20T10:00");addFsPast("A0018","2025-01-25T10:00");
/* 逆算デモ用に希望日を日付化（2026-11-21基準: 60日後/30日後/14日後が到来する人を作る） */
function setStart(id,d,next,last){const a=applicants.find(x=>x.id===id);if(a){a.desired_start_date=d;if(next)a.next_contact_date=next;if(last)a.last_contact_at=last}}
setStart("A0001","2027-01-20","","2026-11-07"); setStart("A0006","2026-12-21","","2026-11-07"); setStart("A0013","2026-12-05","","2026-11-15"); setStart("A0004","2026-12-21","2026-11-20","2026-11-01"); setStart("A0007","2027-02-19","2026-11-21","");
function hasFsHistory(a){if(a.has_fs_history)return true;const v=(a.history||[]).some(h=>normalizeCompany(h.company)==="ファーストスタッフィング")||normalizeCompany(a.source_company)==="ファーストスタッフィング";if(v)a.has_fs_history=true;return v}
/* セグメント区分（共有ログ準拠）: 連絡停止>稼働中>選考中>時期先>条件確認待ち>即提案可能 の優先で1つに判定 */
function segmentOf(a){if(a._segKey===[a.csv_status,a.app_status,a.desired_start_date,a.mail_optout,missingHearing(a).startsWith("ご登録の条件をもとに")].join("|"))return a._seg;const _r=segmentOfCalc(a);a._seg=_r;a._segKey=[a.csv_status,a.app_status,a.desired_start_date,a.mail_optout,missingHearing(a).startsWith("ご登録の条件をもとに")].join("|");return _r}
function segmentOfCalc(a){/* R3 (T2): 終了系は statusStage の terminal 判定 (全種) を使って連絡停止にする (従来は接触NG・登録辞退の2種だけだった)。R3 検証 §1.1-6: 「退職済み」も statusStage が terminal と判定する (TERMINAL_CSV・サーバー csvStageRank_ と一致) */if(a.mail_optout||statusStage(a.csv_status).terminal||a.app_status==="NG"||a.app_status==="譲渡")return "連絡停止";if(a.csv_status==="稼働中"||a.app_status==="稼働開始")return "稼働中";if(["FIX待ち","アテンド待ち","職見待ち","内定待ち"].includes(a.csv_status)||["FIX","アテンド","内定"].includes(a.app_status))return "選考中";const d=a.desired_start_date;if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&(new Date(d)-new Date(new Date().toISOString().slice(0,10)))/864e5>60)return "時期先";if(!missingHearing(a).startsWith("ご登録の条件をもとに"))return "条件確認待ち";return "即提案可能"}
const SEGMENTS=["即提案可能","条件確認待ち","時期先","選考中","稼働中","連絡停止"];
/* R4 O-06: SMS不可の判定 (候補生成と同じ基準)。停止者は「見えるが送れない」が正しい姿 */
function isOptoutForSms(a){return !!a&&(a.mail_optout===true||segmentOf(a)==="連絡停止")}
function optoutSmsBadge(a){return '<span class="badge bad">'+(a&&a.mail_optout?"配信停止済みのためSMSは送れません":"連絡停止のためSMSは送れません")+'</span>'}
/* 入職希望日から逆算した連絡予定（追補7-3）: 60日前=状況確認 / 30日前=案件提案 / 14日前=選考状況確認。希望日未定は対象外 */
function contactSchedule(a){const d=a.desired_start_date;if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return[];const base=new Date(d);return [[60,"状況確認"],[30,"案件提案"],[14,"選考状況確認"]].map(([n,label])=>{const dt=new Date(base);dt.setDate(dt.getDate()-n);return {date:dt.toISOString().slice(0,10),label,daysBefore:n,start:d}})}
function todayStr(){var d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10)}
function dueTodayList(pool){const today=todayStr();const out=[];for(const a of pool){/* R4 10-#3: 終了系・配信停止・稼働中は理由を問わず入口で一括除外する (従来は14日理由だけ部分適用だった) */const seg=segmentOf(a);if(seg==="連絡停止"||seg==="稼働中")continue;const reasons=[];if(a.next_contact_date&&a.next_contact_date<=today)reasons.push("次回連絡日到来（"+a.next_contact_date+"）");for(const s of contactSchedule(a)){if(s.date<=today){const remain=Math.round((new Date(s.start)-new Date(today))/864e5);reasons.push(s.label+"：希望日まで"+remain+"日（予定日 "+s.date+"）")}}if(a.last_contact_at){const diff=Math.round((new Date(today)-new Date(a.last_contact_at))/864e5);if(diff>=14)reasons.push("前回接触から"+diff+"日")}if(reasons.length)out.push({a,reasons})}return out.sort((x,y)=>appliedAtStr(y.a).localeCompare(appliedAtStr(x.a)))}
/* ファネル集計: 本番は applicant_events の event_type(sms_sent/mail_sent/response_received/status_change) を掘り起こしコホートで数える設計。本モックはダミー集計 */
function funnel(pool){pool=nonTestApplicants(pool);const n=pool.length;const contacted=pool.filter(a=>a.sms_sent||a.last_contact_at).length;const replied=state.responses.filter(r=>pool.some(a=>a.id===r.applicant_id)).length;const pct=(v,base)=>base?Math.round(v/base*100):0;const rows=[["対象人数",n,100],["接触済み",contacted,pct(contacted,n)],["返信あり",replied,pct(replied,contacted)],["アテンド",pool.filter(a=>a.app_status==="アテンド"||a.csv_status==="アテンド待ち").length,0],["FIX",pool.filter(a=>a.csv_status==="FIX待ち"||a.app_status==="FIX").length,0],["内定",pool.filter(a=>a.csv_status==="内定待ち"||a.app_status==="内定").length,0],["稼働開始",pool.filter(a=>a.csv_status==="稼働中"||a.app_status==="稼働開始").length,0]];rows.forEach((r,i)=>{if(i>=3)r[2]=pct(r[1],contacted)});return rows.map(r=>[r[0]+"（前段比 "+r[2]+"%）",r[1]])}
</script>
<script>
/* ===== 一覧・5モード＋掘り起こし (DESIGN_V2 §6.1/§8, 追補6, 追補7) ===== */
const MODES=[["first","初回SMS"],["recommend","おすすめ案件"],["special","特需SMS"],["follow","追客・詳細"],["reverse","案件から探す"],["dig","掘り起こし（例外案件）"]];
function viewList(){if(!window._smsSegFilter){try{const sh=JSON.parse(sessionStorage.getItem("smsHandoff")||"null");if(sh&&sh.segment)window._smsSegFilter=sh.segment}catch(e){}}let list=filtered();if(window._smsSegFilter)list=list.filter(a=>segmentOf(a)===window._smsSegFilter);const slice=list.slice(0,state.visible);
 let body="";
 if(state.mode==="special")body=specialView(list);
 else if(state.mode==="reverse")body=reverseView(list);
 else if(state.mode==="dig")body=digView(list);
 else body=`<p class="small"><span id="listTotal">絞込 ${list.length}件</span>／表示 ${slice.length}件／送信済み ${areaSummary(state.area).loading?"読み込み中…":areaSummary(state.area).sent+"名"}（応募日新しい順・20件ずつ追加）</p>`+slice.map(a=>cardHtml(a)).join("")+(list.length>state.visible?`<button class="primary" style="width:100%" onclick="state.visible+=20;route()">さらに20件表示</button>`:"")+(list.length===0?`<div class="card">0件です。理由: 現在の絞り込み条件に一致しません。<button onclick="clearF()">条件を全クリア</button></div>`:"");
 $("#app").innerHTML=`<h2 class="oldH">応募者SMS一覧・関西</h2><p class="dbCountLine">関西全体のDB ${areaSummary(state.area).loading?"読み込み中…":areaSummary(state.area).total+"名"} ／ SMS送信対象 ${areaSummary(state.area).loading?"読み込み中…":areaSummary(state.area).smsTarget+"名"}</p><div class="tabs" role="group" aria-label="モード">${MODES.filter(([k])=>k!=="reverse").map(([k,v])=>`<button aria-pressed="${state.mode===k}" onclick="state.mode='${k}';state.visible=20;route()">${v}</button>`).join("")}<a class="btn" href="#/mail">Gmail配信</a></div><a class="bigNavBtn" href="#/list" onclick="state.mode='reverse';state.visible=20;route()">案件から近くの求職者を探す</a>`+(window._smsSegFilter?`<div class="notice">掘り起こしから引き継ぎ: セグメント「${esc(window._smsSegFilter)}」で絞り込み中 <button onclick="window._smsSegFilter='';try{sessionStorage.removeItem('smsHandoff')}catch(e){};route()">解除</button></div>`:"")+filterBar(list)+body}
function cardHtml(a){const age=ageOf(a.birth_date);let extra="";
 if(state.mode==="first"){const tpl=smsModes.find(m=>m.id===smsModeId)||smsModes[0];const full=personalize(tpl.body,a).replace("{不足ヒヤリング}",missingHearing(a));try{rememberSmsBody(a.id,full,[])}catch(e){}extra=`<div class="flex" style="margin-top:8px">${isOptoutForSms(a)?optoutSmsBadge(a):`<a class="btn primary" href="${smsLink(a.phone,full,(tpl.id==="registration_compact"?"first_compact":"first"))}">SMS作成を開く（端末の作成画面）</a>`}<label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${a.sms_sent?"checked":""} ${isOptoutForSms(a)?"disabled":""} onchange="markSms('${a.id}',this.checked)">送信済み（明示操作で記録）</label></div><p class="small">リンクを開いただけでは送信済みになりません。本文は「SMS作成を開く」から端末の作成画面で確認できます。</p>`}
 if(state.mode==="recommend")extra=recommendHtml(a,false);
 if(state.mode==="follow")extra=followHtml(a);
 const prog=progressHtml(a).replace(/<br><span class="badge term">現在の終了状態：[\s\S]*?<\/span>/,"");
 return `<article class="card" data-anchor="app:${a.id}"><div class="flex cardHead"><b style="font-size:17px">${esc(smsRecipientName(a.name))} 様</b><span class="small">${esc(a.name)}</span>${isTestApplicant(a)?'<span class="badge term">テスト</span>':""}${a.new_application?'<span class="badge warn">新規応募あり</span>':""}${hasFsHistory(a)&&normalizeCompany(a.source_company)!=="ファーストスタッフィング"?'<span class="badge">過去FS応募あり</span>':""}<span class="statusBadge">${progressBadgeHtml(a)}</span></div>
 <p class="small">${a.job_type==="kaigo"?"介護":"看護"} ／ ${age!=null?age+"歳":"年齢未確認"} ／ ${esc(a.prefecture)}${esc(a.municipality)} ／ 応募 ${esc(appliedDay(a))}（${relDays(a.applied_at)}） ／ ${esc(normalizeCompany(a.source_company))}</p>
 ${prog}${responseBadgesHtml(a)}
 <div><span class="badge ${a.sms_sent?"ok":"warn"}">${a.sms_sent?"SMS送信済み":"SMS未送信"}</span></div>
 ${extra}<div class="flex" style="margin-top:8px"><button onclick="openDetail('${a.id}')">詳細</button>${state.mode!=="recommend"?`<button onclick="state.mode='recommend';route()">おすすめ案件を見る</button>`:""}<a class="btn" href="tel:${esc(a.phone)}">電話</a></div></article>`}
function recommendHtml(a,expanded){const recs=recommend(a);const show=expanded?recs:recs.slice(0,5);if(!recs.length)return `<p class="small">おすすめ案件なし（20km以内・同職種の募集中案件がありません。20km超・距離不明は表示しません）</p>`;
 return `<div><b>おすすめ案件（上位${Math.min(5,recs.length)}件表示／全${recs.length}件・20km圏内）</b> <span class="small">並び:</span><button aria-pressed="${state.recSort==="score"}" onclick="state.recSort='score';route()">新着 × 近さ</button><button aria-pressed="${state.recSort==="distance"}" onclick="state.recSort='distance';route()">近さ優先</button><label style="display:inline-flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" ${state.includeFormCase?"checked":""} onchange="state.includeFormCase=this.checked;LS.set('includeFormCase',this.checked);route()">回答フォームURLを差し込む</label>
 ${show.map(c=>{const d=displayCase(c);const body=caseSmsBody(a,c,{withForm:state.includeFormCase});try{rememberSmsBody(a.id,body,[c.id])}catch(e){}const fresh=c.acquired&&Math.round((new Date(todayStr())-new Date(c.acquired))/864e5)<=7;const conds=[d.address,d.hours,d.days].filter(Boolean).join("／");return `<div class="rec"><b>${esc(d.facility)}</b> <span class="badge">${esc(SERVICE_FULL[facilityCode(d)]||facilityCode(d)||d.service)}</span> ${fresh?'<span class="badge ok">新着</span>':""} ${c.dist<=3?'<span class="badge ok">近距離</span>':""} <span class="small">${c.dist!=null?"約"+c.dist.toFixed(1)+"km":"距離不明（同一市区町村）"}</span><br><span class="small">${esc(conds)}／${c.salary?"募集時給":"時給の目安"} ${esc(salaryRange(a,c))}</span><p>${smsCountHtml("case",body)}</p><label style="display:inline-flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" ${((state.multiSel||{})[a.id]||[]).includes(c.id)?"checked":""} ${isOptoutForSms(a)?"disabled":""} onchange="toggleMultiCase('${a.id}','${c.id}',this.checked)">まとめて配信に選ぶ（最大3件）</label><div class="flex"><button onclick="openCase('${c.id}')">詳細を見る</button>${isOptoutForSms(a)?optoutSmsBadge(a):`<a class="btn primary" href="${smsLink(a.phone,body,"case")}">SMS作成を開く</a>`}<button onclick="editCaseBody('${a.id}','${c.id}')">本文を確認・編集</button></div></div>`}).join("")}

/* ===== R3 方式変更: 画面からのバッチ送信 (施設メール配信と同じ方式) =====
   配信作成後、この画面が sendNextBatch を繰り返し呼んで自分のキューを送り切る。
   実行はアクセスユーザーとして走るため、その人の Gmail から送られ送信済みに残る。
   画面を閉じると送信は止まるが、キューはサーバーに残るので、次に開いたとき
   「送信を再開する」(resumeSendBatches) から続きを送れる。 */
function paintSendProgress(html){const mp=$("#mailProg");if(mp)mp.innerHTML=html}
function runSendBatches(d){
  if(window._sendRun&&window._sendRun.active)return;
  window._sendRun={active:true,abort:false,sentTotal:0,lastRemaining:null,stuck:0,postErrTotal:0,postErrDetails:[]};
  paintSendProgress(`<p>送信中…（この画面を開いている間だけ送信が進みます）</p><p class="small">送信済み 0件</p><div class="flex"><button onclick="abortSendBatches()">送信を中断する</button></div>`);
  const postErrHtml=function(){var n=(window._sendRun&&window._sendRun.postErrTotal)||0;if(!n)return "";var det=((window._sendRun&&window._sendRun.postErrDetails)||[]).map(function(x){return esc(typeof x==="string"?x:((x&&(x.label||x.message||x.error))||JSON.stringify(x)))}).join(" / ");return '<p class="badge bad">記録に失敗: '+n+'件</p>'+(det?'<details><summary>失敗の詳細</summary><p class="small">'+det+"</p></details>":"")};
  const step=function(){
    if(!window._sendRun||!window._sendRun.active)return;
    if(window._sendRun.abort){window._sendRun.active=false;paintSendProgress(`<p class="badge warn">送信を中断しました。残りはサーバーに残っています。この画面の「送信を再開する」から続きを送れます。</p>`+postErrHtml());try{refreshQueueWarning()}catch(e){}return}
    apiCall({action:"sendNextBatch",batch_size:25}).then(function(res){
      if(!window._sendRun||!window._sendRun.active)return;
      if(res&&res.skipped==="locked"){setTimeout(step,3000);return}
      if(res&&res.skipped){window._sendRun.active=false;paintSendProgress(`<p class="badge warn">今は送信できません（理由: ${esc(String(res.skipped))}）。残りはサーバーに残っています。</p>`+postErrHtml());try{refreshQueueWarning()}catch(e){}return}
      if(res&&typeof res.post_errors==="number"&&res.post_errors>0){window._sendRun.postErrTotal+=res.post_errors;if(Array.isArray(res.post_error_details))window._sendRun.postErrDetails=window._sendRun.postErrDetails.concat(res.post_error_details).slice(0,20)}
      const st=(res&&res.stats)||{};const counts=st.counts||{};
      const sentTotal=window._sendRun.sentTotal+(res?res.sent||0:0); /* 02-01: 主表示は今回runの積算。counts.sent(送信者の生涯累計)は表示に使わない */
      window._sendRun.sentTotal=sentTotal;
      const remaining=res&&typeof res.remaining==="number"?res.remaining:null;
      const waiting=st.waiting!=null?st.waiting:remaining;
      if(remaining===0){window._sendRun.active=false;if(d){d.status="done";saveAll()}paintSendProgress(`<p class="badge ok">完了: ${sentTotal}件を送信しました。</p>`+postErrHtml());try{refreshQueueWarning()}catch(e){}return}
      const progressed=(res&&(res.sent||0)+(res.failed||0)+(res.skipped_excluded||0))>0;
      if(!progressed&&remaining!=null&&window._sendRun.lastRemaining===remaining){window._sendRun.stuck++;if(window._sendRun.stuck>=2){window._sendRun.active=false;paintSendProgress(`<p class="badge warn">送信が進まなくなりました。残り ${remaining} 件はサーバーに残っています。時間をおいて再開してください。</p>`+postErrHtml());try{refreshQueueWarning()}catch(e){}return}}
      else window._sendRun.stuck=0;
      window._sendRun.lastRemaining=remaining;
      paintSendProgress(`<p>送信中…（この画面を開いている間だけ送信が進みます）</p><p class="small">送信済み ${sentTotal}件 ／ 残り ${waiting!=null?waiting:remaining}件</p><div class="flex"><button onclick="abortSendBatches()">送信を中断する</button></div>`);
      setTimeout(step,350);
    }).catch(function(e){
      if(!window._sendRun)return;
      window._sendRun.active=false;
      paintSendProgress(`<p class="badge bad">送信が止まりました: ${esc(String(e&&e.message||e))} 残りはサーバーに残っています。「送信を再開する」から続きを送れます。</p>`+postErrHtml());
    });
  };
  step();
}

function resolveCaseCoord(r,j){var la=Number(r&&r.lat),lo=Number(r&&r.lon);
  if(r&&r.lat!==""&&r.lon!==""&&r.lat!=null&&r.lon!=null&&isFinite(la)&&isFinite(lo))return{kind:"coord",lat:la,lon:lo};
  var rep=(typeof muniRepPoint==="function"&&j)?muniRepPoint(j.pref,j.muni):null;
  if(rep)return{kind:"rep",lat:rep.lat,lon:rep.lon};return{kind:"none",lat:null,lon:null}}

function previewCaseImport(){const inp=document.getElementById("caseFiles");const files=inp?[...inp.files]:[];if(!files.length){alert("案件CSVファイルを選んでください");return}(async()=>{let all=[];for(const f of files){const text=await decodeFile(f);all.push(...parseCaseCsv(text))}const judged=all.map(r=>({r,j:judgeCaseRow(r)}));caseImportPreview={judged};const ok=judged.filter(x=>x.j.ok),dups=ok.filter(x=>x.j.dup),news=ok.filter(x=>!x.j.dup);const ng=judged.filter(x=>!x.j.ok);/* R3 (検証 #33): 座標の内訳をプレビューで明示する (確定時の解決方式と同じ判定) */let coordHas=0,coordRep=0,coordNone=0,coordDown=0;const downReasons={};for(const x of ok){const r=x.r;const chk=coordBasicCheck(r.lat,r.lon);if(chk.state==="ok"){const pc=coordPrecisionCheck(chk.lat,chk.lon,muniRepPoint(x.j.pref,x.j.muni),null);if(pc.precise){coordHas++;continue}coordDown++;downReasons[pc.reason]=(downReasons[pc.reason]||0)+1;continue}if(chk.state==="invalid"){coordDown++;downReasons[chk.reason]=(downReasons[chk.reason]||0)+1;continue}const rep=muniRepPoint(x.j.pref,x.j.muni);if(rep)coordRep++;else coordNone++}document.getElementById("caseImpResult").innerHTML=`<h3>案件取り込み 確認画面（まだ反映していません）</h3><p>読込 ${judged.length}件 ／ 新規 ${news.length}件 ／ 既存と重複（既存を優先・追加しない） ${dups.length}件 ／ 除外 ${ng.length}件</p><p class="small">座標の内訳（取り込み対象 ${ok.length}件）: 精密座標あり ${coordHas}件 ／ 検証で降格 ${coordDown}件${coordDown?`（${Object.entries(downReasons).map(([k,v])=>k+" "+v+"件").join("・")}）`:""} ／ 市区町村代表点で補完 ${coordRep}件 ／ 座標不明 ${coordNone}件（座標不明の案件は距離が測れないため、おすすめでは「距離不明」として扱います）</p><p class="small">除外理由別: ${ng.map(x=>x.j.reason).filter((v,i,arr)=>arr.indexOf(v)===i).map(k=>k+" "+ng.filter(x=>x.j.reason===k).length+"件").join(" ／ ")||"なし"}。地域は住所（都道府県）から自動判定しています。</p><button class="primary" onclick="commitCaseImport()">確定で反映（新規のみ追加）</button>`})()}

function phoneInfo(r){

}

<script>

/* ---------- 差し込みタグ {最寄り} {希望条件} {新着案件} (実データがある場合だけ生成・無ければ行ごと省略) ---------- */

var TERMINAL_CSV=["不通","選考NG","他社決定","登録辞退","応募除外","接触NG","対象外","退職済み"];

function daysAgo(iso){if(!iso)return null;return Math.round((new Date(todayStr())-new Date(String(iso).slice(0,10)))/864e5)}
function startProximity(a){var d=a.desired_start_date;if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return 0;var diff=Math.round((new Date(d)-new Date(todayStr()))/864e5);if(diff<=14)return 1;if(diff<=30)return 0.8;if(diff<=60)return 0.5;if(diff<=90)return 0.25;return 0.1}
function digScore(a,today){today=today||todayStr();if(!a||isTestApplicant(a))return {score:null,excluded_reason:"test"};if(TERMINAL_CSV.includes(a.csv_status)||statusStage(a.csv_status).terminal||a.app_status==="NG"||a.app_status==="譲渡")return {score:null,excluded_reason:"terminal"};if(a.mail_optout||segmentOf(a)==="連絡停止")return {score:null,excluded_reason:"optout"};refreshProgress(a);if(a.furthest_status&&a.furthest_status.status==="稼働中")return {score:null,excluded_reason:"already_started"};var appliedDays=daysAgo(a.applied_at);var freshness=appliedDays==null?0:Math.max(0,1-appliedDays/90);var stage=stageNumOf(a)/8;var prox=startProximity(a);var lastC=a.last_contact_at||String(a.applied_at).slice(0,10);var gapDays=daysAgo(lastC);var gap=(gapDays!=null&&gapDays>=14)?Math.min(1,(gapDays-14)/46):0;var score=Math.round(35*freshness+25*stage+30*prox+10*gap);var parts=[];if(appliedDays!=null)parts.push("\u6700\u7d42\u5fdc\u52df "+String(a.applied_at).slice(5,10).replace("-","\u6708")+"\u65e5\uff08"+appliedDays+"\u65e5\u524d\uff09");if(a.furthest_status)parts.push("\u6b62\u307e\u3063\u3066\u3044\u308b\u6bb5\u968e: "+a.furthest_status.status);var sched=contactSchedule(a);var dueS=sched.filter(function(s){return s.date<=today});if(dueS.length&&a.desired_start_date){var remain=Math.round((new Date(a.desired_start_date)-new Date(today))/864e5);parts.push("\u5165\u8077\u5e0c\u671b "+String(a.desired_start_date).slice(5,10).replace("-","\u6708")+"\u65e5\u307e\u3067"+remain+"\u65e5\uff08"+dueS[dueS.length-1].label+"\u306e\u6642\u671f\uff09")}if(gapDays!=null&&gapDays>=14)parts.push("\u524d\u56de\u63a5\u89e6\u304b\u3089"+gapDays+"\u65e5");var flags={next_due:!!(a.next_contact_date&&a.next_contact_date<=today),response_open:state.responses.some(function(r){return r.applicant_id===a.id&&respStatus(r)!=="handled"})};if(flags.next_due)parts.unshift("\u6b21\u56de\u9023\u7d61\u65e5 "+a.next_contact_date+" \u3092\u904e\u304e\u3066\u3044\u307e\u3059");if(flags.response_open)parts.unshift("\u672a\u5bfe\u5fdc\u306e\u56de\u7b54\u3042\u308a");return {score:score,parts:{freshness:freshness,stage:stage,startProximity:prox,contactGap:gap},reason_text:parts.join("\uff0f"),flags:flags,applied_at:a.applied_at}}
function digTodaySorted(pool){var rows=[];(pool||[]).forEach(function(a){var d=digScore(a);if(d.score!=null)rows.push({a:a,dig:d})});rows.sort(function(x,y){return ((y.dig.flags.response_open?1:0)-(x.dig.flags.response_open?1:0))||((y.dig.flags.next_due?1:0)-(x.dig.flags.next_due?1:0))||(y.dig.score-x.dig.score)||String(y.a.applied_at).localeCompare(String(x.a.applied_at))});return rows}

<script>

   - 電話希望: #fCallDate + callSlot/callTiming チップ + #fPhone(補足) を

function buildCallDatetime_(parts){

  if(Array.isArray(parts.dates)||Array.isArray(parts.bands)||parts.anytime!=null){
    var seenD={};var dates=(parts.dates||[]).filter(function(d){var s=String(d);if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||seenD[s])return false;seenD[s]=1;return true}).sort();
    var bands=PHONE_BAND_ORDER.filter(function(b){return (parts.bands||[]).indexOf(b)>=0});
    var noteN=String(parts.note||"").trim();
    var dl=dates.map(function(d){var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(d);var dt=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));var wd="日月火水木金土"[dt.getDay()];return Number(m[2])+"/"+Number(m[3])+"（"+wd+"）"});

<script>
/* ===== R6.5: CSV取り込みエラー防止 (検証・原子性・一致保証・エラーの平易化) =====
   方針: ファイル選択時点で壊れたCSVを止め、確定はチャンク単位で
   「全件着地」か「失敗として記録」のどちらかにし、失敗チャンクは
   バッチ画面からそのチャンクだけ再実行できるようにする。
   プレビューと確定の食い違いは、サーバー実績で履歴を上書きし、
   差異の理由を履歴とサーバーのバッチ note の両方に残す。 */
var R65_MAX_FILE_ROWS=30000;
var R65_QUEUE_THRESHOLD=1000;
var R65_CHUNK_STORE_KEY="r65_import_chunks";

/* --- 厳密CSVパース (診断つき): parseCsvText と同じ字句規則で読み、
       引用符の閉じ忘れの開始行と、列数がヘッダーと合わない行 (行番号つき) を記録する。
       parseCsvText 本体の挙動は変えない (これは検証専用の並行実装)。 --- */
function strictParseCsv65(text){
  if(text&&text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  text=String(text||"");
  var firstLine=(text.split(/\r\n|\r|\n/,1)[0]||"");
  var delim=((firstLine.match(/\t/g)||[]).length>(firstLine.match(/,/g)||[]).length)?"\t":",";
  var rows=[],rowLines=[],cur="",inQ=false,fieldStart=true,row=[];
  var line=1,rowStartLine=1,quoteLine=0,unclosedQuoteLine=0;
  function endField(){row.push(cur);cur="";fieldStart=true}
  function endRow(){endField();rows.push(row);rowLines.push(rowStartLine);row=[]}
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}
      else{cur+=ch;if(ch==="\n")line++}
    }
    else if(ch==='"'&&fieldStart){inQ=true;fieldStart=false;quoteLine=line}
    else if(ch===delim){endField()}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;endRow();line++;rowStartLine=line}
    else{cur+=ch;fieldStart=false}
  }
  if(inQ){
    unclosedQuoteLine=quoteLine;
    var extra=cur.split(/\r\n|\r|\n/);cur=extra[0]||"";endRow();
    for(var k=1;k<extra.length;k++){rows.push(extra[k].split(delim));rowLines.push(rowStartLine+k)}
  }
  else if(cur!==""||row.length)endRow();
  var outRows=[],outLines=[];
  rows.forEach(function(r,idx){
    if(r.some(function(c){return String(c).trim()!==""})){outRows.push(r);outLines.push(rowLines[idx])}
  });
  /* 列数チェックは RAW のセル数で比べる。末尾の空セル (末尾カンマ) は正常。
     ヘッダーより少ない行は不一致。多い行は、はみ出したセルが全部空なら正常。 */
  var headerCols=outRows.length?outRows[0].length:0;
  var mismatches=[];
  outRows.forEach(function(r,idx){
    if(idx===0)return;
    if(r.length<headerCols){mismatches.push({line:outLines[idx],expected:headerCols,actual:r.length});return}
    if(r.length>headerCols&&r.slice(headerCols).some(function(c){return String(c).trim()!==""})){
      mismatches.push({line:outLines[idx],expected:headerCols,actual:r.length});
    }
  });
  return {rows:outRows,rowLines:outLines,diag:{unclosedQuoteLine:unclosedQuoteLine,colMismatches:mismatches,headerCols:headerCols}};
}

/* --- ファイル検証: 問題があれば {errors:[平易な日本語]} を返す (空なら合格) --- */
function validateImportData65(rows,diag){
  var errors=[];
  if(!rows||!rows.length){errors.push("ファイルにデータ行がありません（空のファイルです）。中身のあるCSVを選んでください");return {errors:errors,warnings:[]}}
  var head=rows[0].map(function(h){return String(h==null?"":h).replace(/^﻿+/,"").trim()});
  var norm=function(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/[\s　]/g,"")};
  var seen={},dups=[];
  head.forEach(function(h){var n=norm(h);if(!n)return;if(seen[n]&&dups.indexOf(h)<0)dups.push(h);seen[n]=true});
  if(dups.length)errors.push("見出し（ヘッダー）が重複しています: "+dups.join("、")+"。同じ名前の列が2つあると、どちらの列を使うか判断できません。元のシステムで列名を分けてから取り込んでください");
  var dataCount=rows.length-1;
  if(dataCount>R65_MAX_FILE_ROWS)errors.push("データ行が "+dataCount+" 行あります（上限は "+R65_MAX_FILE_ROWS+" 行です）。"+Math.ceil(dataCount/15000)+" 個くらいに分割してから取り込んでください（目安: 15,000行ずつ）");
  if(diag&&diag.unclosedQuoteLine)errors.push(diag.unclosedQuoteLine+" 行目で始まる引用符（\"）が閉じていません。その行のセルを確認してください（セル内に \" がある場合は \"\" と二重にするか、セル全体を \" で囲ってください）");
  if(diag&&diag.colMismatches&&diag.colMismatches.length){
    var ms=diag.colMismatches;
    var shown=ms.slice(0,5).map(function(m){return m.line+"行目（"+m.actual+"列／ヘッダーは"+m.expected+"列）"}).join("、");
    errors.push("列数がヘッダーと合わない行があります: "+shown+(ms.length>5?"、ほか"+(ms.length-5)+"件":"")+"。セル内のカンマが引用符で囲われていないか、カンマの入れ忘れがないか確認してください");
  }
  var hasExact=function(list){var nl=list.map(norm);return head.some(function(h){return list.indexOf(h)>=0||nl.indexOf(norm(h))>=0})};
  var hasPat=function(re){return head.some(function(h){return re.test(norm(h))})};
  if(!hasExact(SYNONYMS.name)&&!hasPat(/氏名|名前|求職者|応募者|お名前/))errors.push("氏名の列が見つかりません。見出しに「氏名」を含む列が必要です");
  var hasPhone=hasExact(SYNONYMS.phone)||hasPat(/電話|携帯|tel/i);
  var hasEmail=hasExact(SYNONYMS.email)||hasPat(/メール|e-mail|email/i);
  if(!hasPhone&&!hasEmail)errors.push("電話番号・メールアドレスの列がどちらも見つかりません。応募者と照合できないため取り込めません。どちらかの列を入れてください");
  var hasBirth=hasExact(SYNONYMS.birth_date)||hasPat(/生年月日|誕生日/);
  var hasAge=hasExact(SYNONYMS.age)||hasPat(/年齢/);
  if(!hasBirth&&!hasAge)errors.push("生年月日・年齢の列がどちらも見つかりません（年齢を確認できない人は全員除外されます）。見出しに「生年月日」を含む列を入れてください");
  return {errors:errors,warnings:[]};
}

/* --- サーバーエラーの翻訳: 画面には「何が・なぜ・どうすれば」を出す --- */
function translateImportError65(msg){
  var m=String(msg||"");
  if(!m)return "サーバー同期に失敗しました。取り込み画面から再送できます";
  if(/別の書き込み処理が実行中|ロック/.test(m))return "サーバーが他の書き込み処理で混み合っています。少し待ってから再送してください（データは壊れていません）";
  if(/5000/.test(m))return "1回の送信が上限（5,000行）を超えています。ファイルを分割して取り込んでください";
  if(/rows が空/.test(m))return "送信する行がありませんでした。ファイルの内容を確認してください";
  if(/Failed to fetch|NetworkError|network/i.test(m))return "通信できませんでした。ネットワーク接続を確認してから再送してください";
  if(/401|403|ログイン|認証/.test(m))return "ログイン状態が切れている可能性があります。会社のGoogleアカウントでログインし直してください";
  return "サーバーでエラーが発生しました: "+m+"。再送しても直らない場合は、この文面をそのまま管理者へ伝えてください";
}

/* --- 履歴の確定: プレビュー件数ではなくサーバー実績で上書きし、差異があれば理由を残す --- */
function importHistoryFromServer65(previewCounts,agg){
  if(!agg||!agg.server)return null;
  var s=agg.server;
  /* R6.9 (欠陥3b): 内訳の割り方を経路で変えない。
     サーバー実績に attr_updated がある経路 (直接送信) では実績で割り、
     無い経路 (キュー方式: import_batches に attr_updated 列が無く、
     getImportStatus も返さない) では、プレビュー時のサーバー照合が持つ
     内訳 (preview_counts) を保ち、合計だけをサーバー実績に合わせる。
     旧実装は attr_updated の欠落を 0 とみなし、latest が updated 全件に
     化けていた (最新応募1/更新1404 が 最新応募1405/更新0 に変わった)。 */
  var totalUpd=Number(s.updated||0);
  var latest,updAttr;
  if(s.attr_updated!=null){updAttr=Number(s.attr_updated||0);latest=Math.max(0,totalUpd-updAttr)}
  else if(previewCounts){latest=Math.min(Number(previewCounts.latest||0),totalUpd);updAttr=totalUpd-latest}
  else{latest=0;updAttr=totalUpd}
  /* スキップと除外: サーバー実績の skipped は両方の合計。内訳は
     preview_counts 側の除外件数を保ち、残りをスキップとする
     (旧実装は除外を常に 0 に潰していた)。 */
  var excl=previewCounts?Number(previewCounts.excluded||0):0;
  var skip=Math.max(0,Number(s.skipped||0)-excl);
  var out={new:Number(s.added||0),latest:latest,updated:updAttr,
    skip:skip,excluded:excl,failed:Number(s.failed||0)};
  var diffs=[];
  if(previewCounts){
    if(out.new!==Number(previewCounts.new||0))diffs.push("新規 "+Number(previewCounts.new||0)+"→"+out.new);
    var pUpd=Number(previewCounts.latest||0)+Number(previewCounts.updated||0);
    if(pUpd!==totalUpd)diffs.push("更新 "+pUpd+"→"+totalUpd);
    var pSkip=Number(previewCounts.skip||0)+Number(previewCounts.excluded||0);
    if(pSkip!==Number(s.skipped||0))diffs.push("スキップ・除外 "+pSkip+"→"+Number(s.skipped||0));
  }
  if(diffs.length){
    var reasons=Object.keys(s.skipped_reasons||{}).filter(function(k){return Number(s.skipped_reasons[k]||0)>0})
      .map(function(k){return k+" "+Number(s.skipped_reasons[k])+"件"}).join("、");
    out.diff_note="プレビューとの差異（"+diffs.join(" / ")+"）"+(reasons?"。サーバー側の除外理由: "+reasons:"")+"。取り込みの前後で既存データが変わった場合に差異が出ます";
  }
  return out;
}

/* --- decodeFile の差し替え: 戻り値の契約は同一。判定した文字コードと
       文字化け量を window._r65LastDecode に残し、検証で使う --- */
var _r65OrigDecodeFile=decodeFile;
decodeFile=async function(file){
  var buf=await file.arrayBuffer();
  var sig=new Uint8Array(buf.slice(0,2));
  var enc="",text="";
  if(sig[0]===255&&sig[1]===254){enc="utf-16le";text=new TextDecoder("utf-16le").decode(buf)}
  else if(sig[0]===254&&sig[1]===255){enc="utf-16be";text=new TextDecoder("utf-16be").decode(buf)}
  else{
    try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf);enc="utf-8"}
    catch(e){text=new TextDecoder("shift-jis").decode(buf);enc="shift-jis"}
  }
  var fffd=0,ctrl=0;
  for(var i=0;i<text.length;i++){var c=text.charCodeAt(i);if(c===0xFFFD)fffd++;else if(c<0x20&&c!==9&&c!==10&&c!==13)ctrl++}
  window._r65LastDecode={encoding:enc,fffd:fffd,ctrl:ctrl,fileName:(file&&file.name)||""};
  return text;
};

/* --- 検証で止まったファイル / 警告の表示 --- */
function renderR65ImportIssues_(){
  try{
    var blocked=window._r65Blocked||[];
    var warnings=window._r65Warnings||[];
    if(!blocked.length&&!warnings.length)return;
    var slot=document.getElementById("impResult");
    if(!slot)return;
    var html="";
    if(blocked.length){
      html+='<div class="card"><h3>取り込めなかったファイル</h3>'+blocked.map(function(b){
        return '<p><b>'+esc(b.file)+'</b></p>'+b.errors.map(function(e){return '<p class="small">・'+esc(e)+'</p>'}).join("");
      }).join("")+'<p class="small">上記を直してから、そのファイルだけもう一度選んでください（他のファイルの取り込みには影響しません）。</p></div>';
    }
    if(warnings.length){
      html+='<div class="card"><h3>取り込み時の注意</h3>'+warnings.map(function(w){
        return '<p class="small">・'+esc(w.file)+': '+esc(w.message)+'</p>';
      }).join("")+'</div>';
    }
    if(importPreview||!slot.innerHTML)slot.insertAdjacentHTML("beforeend",html);
    else slot.innerHTML=html;
  }catch(e){}
}

/* --- previewImport の差し替え: 選択時点で検証し、問題のあるファイルは
       プレビューに進ませない (ファイル単位で隔離し、他ファイルは通常どおり進める) --- */
var _r65PrevPreviewImport=previewImport;
previewImport=async function(){
  var inp=$("#impFiles");
  var files=[...(inp?inp.files:[])];
  window._r65Blocked=[];window._r65Warnings=[];window._r65RebuildFailed=false;
  if(!files.length)return _r65PrevPreviewImport();
  var keep=[];
  for(var fi=0;fi<files.length;fi++){
    var f=files[fi];
    if(isExcelFile(f.name)){keep.push(f);continue}
    var text=null;
    try{text=await decodeFile(f)}catch(e){text=null}
    if(typeof text!=="string"){keep.push(f);continue} /* 検証できない場合は従来動作に任せる */
    var errs=[];
    var dec=window._r65LastDecode||{};
    if(dec.ctrl>0)errs.push("文字コードを判定できませんでした（判別できない文字が含まれています）。Excelで開いて「CSV UTF-8」または「Shift-JIS」で保存し直してください");
    else if(dec.fffd>=3)errs.push("文字コードを判定できませんでした（一部の文字が化けています）。UTF-8かShift-JISで保存し直してください");
    var strict=strictParseCsv65(text);
    var v=validateImportData65(strict.rows,strict.diag);
    v.errors.forEach(function(m){errs.push(m)});
    if(errs.length){window._r65Blocked.push({file:f.name,errors:errs});continue}
    if(dec.fffd>0)window._r65Warnings.push({file:f.name,message:"一部の文字が置き換え文字になっています（"+dec.fffd+"文字）。文字コードを確認してください"});
    keep.push(f);
  }
  if(window._r65Blocked.length&&inp){
    try{var dt=new DataTransfer();keep.forEach(function(f){dt.items.add(f)});inp.files=dt.files}
    catch(e){window._r65RebuildFailed=true}
  }
  if(!keep.length){
    importPreview=null;
    var slot=$("#impResult");
    if(slot)slot.innerHTML="";
    renderR65ImportIssues_();
    return;
  }
  await _r65PrevPreviewImport();
  renderR65ImportIssues_();
};

/* --- opToRequests の差し替え: チャンク再実行時の chunk_seq と
       プレビュー件数の受け渡し (通常経路のリクエスト形状は変えない) --- */
var _r65PrevOpToRequests=opToRequests;
opToRequests=function(op){
  var reqs=_r65PrevOpToRequests(op);
  try{
    if(op&&op.type==="import_commit"&&Array.isArray(reqs)&&reqs.length){
      var p=op.payload||{};
      if(p.chunk_seq_offset!=null&&reqs.length===1)reqs[0].chunk_seq=Number(p.chunk_seq_offset);
      if(Array.isArray(p.preview_counts_by_chunk)){
        reqs.forEach(function(r,i){
          var pc=p.preview_counts_by_chunk[p.chunk_seq_offset!=null?0:i];
          if(pc)r.preview_counts=pc;
        });
      }
    }
  }catch(e){}
  return reqs;
};

/* --- 失敗チャンクの保存と再実行 (チャンク単位の原子性・再開) --- */
function r65LoadChunkStore_(){try{var v=LS.get(R65_CHUNK_STORE_KEY,[]);return Array.isArray(v)?v:[]}catch(e){return[]}}
function r65SaveChunkStore_(store){try{LS.set(R65_CHUNK_STORE_KEY,store)}catch(e){}}
function persistFailedImportChunks65_(doneOps,opsMeta){
  var store=r65LoadChunkStore_();var changed=false;
  (doneOps||[]).forEach(function(op,oi){
    if(!op||!Array.isArray(op.results))return;
    var meta=opsMeta&&opsMeta[oi];if(!meta)return;
    op.results.forEach(function(r,seq){
      if(!r||typeof r!=="object")return;
      if(r.status==="partial"||Number(r.failed||0)>0){
        var rows=meta.srows.slice(seq*500,seq*500+500);
        if(!rows.length)return;
        store=store.filter(function(e){return !(e.opId===op.opId&&Number(e.chunk_seq)===seq)});
        store.push({opId:op.opId,chunk_seq:seq,file_name:meta.file_name,target_area:meta.target_area,rows:rows,at:new Date().toISOString()});
        changed=true;
      }
    });
  });
  if(changed){while(store.length>12)store.shift();r65SaveChunkStore_(store)}
}
function findImportChunkRows65(clientOpId,seq){
  seq=Number(seq);
  try{
    var ops=(typeof outbox!=="undefined"&&Array.isArray(outbox))?outbox:[];
    for(var i=0;i<ops.length;i++){
      var op=ops[i];
      if(op&&op.opId===clientOpId&&op.type==="import_commit"&&op.payload&&Array.isArray(op.payload.rows)){
        var rows=op.payload.rows.slice(seq*500,seq*500+500);
        if(rows.length)return {rows:rows,file_name:op.payload.file_name||"",target_area:op.payload.target_area||""};
      }
    }
  }catch(e){}
  var store=r65LoadChunkStore_();
  for(var j=0;j<store.length;j++){
    if(store[j].opId===clientOpId&&Number(store[j].chunk_seq)===seq){
      return {rows:store[j].rows,file_name:store[j].file_name||"",target_area:store[j].target_area||""};
    }
  }
  return null;
}
function retryImportChunk65(clientOpId,seq){
  seq=Number(seq);
  var found=findImportChunkRows65(clientOpId,seq);
  if(!found){alert("このチャンクのデータはこの端末に残っていません。元のCSVファイルから再取り込みしてください（取り込み済みの行は二重登録されません）");return}
  /* 再実行の成功で元opが outbox から消えても他のチャンクを失わないよう、
     元opの全チャンクを先に保存へ退避する */
  try{
    var orig=(typeof outbox!=="undefined"?outbox:[]).find(function(o){return o&&o.opId===clientOpId&&o.type==="import_commit"});
    if(orig&&orig.payload&&Array.isArray(orig.payload.rows)&&orig.payload.rows.length>500){
      var store=r65LoadChunkStore_();
      for(var s=0;s*500<orig.payload.rows.length;s++){
        if(!store.some(function(e){return e.opId===clientOpId&&Number(e.chunk_seq)===s})){
          store.push({opId:clientOpId,chunk_seq:s,file_name:orig.payload.file_name||"",target_area:orig.payload.target_area||"",rows:orig.payload.rows.slice(s*500,s*500+500),at:new Date().toISOString()});
        }
      }
      while(store.length>12)store.shift();
      r65SaveChunkStore_(store);
    }
  }catch(e){}
  var op={opId:clientOpId,type:"import_commit",payload:{file_name:found.file_name,kind:"applicants",target_area:found.target_area||state.area,rows:found.rows,chunk_seq_offset:seq},at:new Date().toISOString(),status:"pending"};
  showToast("チャンクを再実行しています…");
  API.commit(op).then(function(done){
    if(done&&done.status==="done"){
      var r=(done.results&&done.results[0])||{};
      if(r.status==="complete"){
        var store=r65LoadChunkStore_().filter(function(e){return !(e.opId===clientOpId&&Number(e.chunk_seq)===seq)});
        r65SaveChunkStore_(store);
      }
      showToast("チャンクを再実行しました: 新規 "+(r.added||0)+" / 更新 "+(r.updated||0)+" / 除外 "+(r.skipped||0)+(r.status==="partial"?"（一部失敗が残っています）":""));
    }else{
      showToast(translateImportError65(done&&done.error),"bad");
    }
    try{fetchImportStatusR6_()}catch(e){}
    try{route()}catch(e){}
  });
}

/* --- commitImport の差し替え (R6 のサーバーモード確定 + R6.5 の保証) --- */
var _r65PrevCommitImport=commitImport;
commitImport=function(){
  /* 検証で止めたファイルが (入力の組み直しに失敗して) プレビューに混ざっていたら確定しない */
  try{
    var blocked=window._r65Blocked||[];
    if(blocked.length&&window._r65RebuildFailed){
      var badNames={};blocked.forEach(function(b){badNames[b.file]=1});
      var hit=(window._importPerFile||[]).some(function(pf){return badNames[pf.file]&&pf.rows>0});
      if(hit){alert("取り込めないファイルが含まれています:\n"+blocked.map(function(b){return "・"+b.file+": "+b.errors.join(" / ")}).join("\n")+"\nファイルの内容を直してから、もう一度確認してください");return}
    }
  }catch(e){}
  if(!window._r6ServerMode)return _r65PrevCommitImport();
  if(importCommitting)return;
  if(!importPreview)return;
  if(window._importDemo){alert("これは表示確認用のサンプルです。実際の取り込みはCSVファイルを選んでください。");return}
  importCommitting=true;
  var snap=importPreview;importPreview=null;
  var counts={new:0,latest:0,updated:0,skip:0,excluded:0};
  var unclassified=0;
  var _serverPreview=!snap.judged&&!!snap.serverCounts;
  if(_serverPreview){var _sc=snap.serverCounts;counts={new:_sc.new||0,latest:_sc.latest||0,updated:(_sc.attr_updated!=null?_sc.attr_updated:Math.max(0,(_sc.updated||0)-(_sc.latest||0))),skip:_sc.skip||0,excluded:0};unclassified=_sc.unclassified||0}
  else{snap.judged.forEach(function(x){if(counts[x.j.category]!=null)counts[x.j.category]++});unclassified=snap.judged.filter(function(x){return x.r.csv_status&&!CSV_STATUSES.includes(x.r.csv_status)}).length}
  state.imports.unshift({at:todayStr(),file:snap.fname,new:counts.new,latest:counts.latest,updated:counts.updated,skip:counts.skip,excluded:counts.excluded,hash:window._importHash||"",unclassified:unclassified,sync:"sending",preview_counts:{new:counts.new,latest:counts.latest,updated:counts.updated,skip:counts.skip,excluded:counts.excluded}});
  saveAll();
  var groups=[];if(_serverPreview){try{var _raw=snap.rows||[];var _pos=0;(window._importPerFile||[]).forEach(function(pf){var _n=pf.rows||0;groups.push({file_name:pf.file||"",rows:_raw.slice(_pos,_pos+_n).map(function(r){return{r:r,j:null}})});_pos+=_n});if(_pos!==_raw.length||!groups.length)groups=[{file_name:snap.fname||"",rows:_raw.map(function(r){return{r:r,j:null}})}]}catch(e){groups=[{file_name:snap.fname||"",rows:(snap.rows||[]).map(function(r){return{r:r,j:null}})}]}}else{try{groups=splitJudgedByFile(snap.judged,window._importPerFile)}catch(e){groups=[{rows:snap.judged}]}}
  var groupData=[];
  groups.forEach(function(g){
    var srows=(g.rows||[]).map(function(x){return importRowToServer(x&&x.r?x.r:x)});
    if(!srows.length)return;
    var pcbc=[];
    if(_serverPreview){
      var _srv=null;try{_srv=(snap.perFile||[]).filter(function(pr){return pr&&(pr.file_name===(g.file_name||g.file||"")||pr.file===(g.file_name||g.file||""))})[0]}catch(e){}
      if(_srv&&Array.isArray(_srv.preview_counts_by_chunk)&&_srv.preview_counts_by_chunk.length){pcbc=_srv.preview_counts_by_chunk.map(function(pc){return{added:pc.added||0,updated:pc.updated||0,skipped:pc.skipped||0}})}
      else if(_srv){pcbc=[{added:_srv.added||0,updated:_srv.updated||0,skipped:_srv.skipped||0}]}
      else{pcbc=[{added:0,updated:0,skipped:0}]}
    }else{
      for(var s=0;s<srows.length;s+=500){
        var pc={added:0,updated:0,skipped:0};
        (g.rows||[]).slice(s,s+500).forEach(function(x){
          var c=x&&x.j?x.j.category:"";
          if(c==="new")pc.added++;else if(c==="latest"||c==="updated")pc.updated++;else pc.skipped++;
        });
        pcbc.push(pc);
      }
    }
    groupData.push({file_name:g.file_name||g.file||"",target_area:state.area,srows:srows,pcbc:pcbc});
  });
  var totalRows=groupData.reduce(function(a,g){return a+g.srows.length},0);
  if(totalRows>R65_QUEUE_THRESHOLD){commitImportViaQueue65_(snap,counts,groupData);return}
  var totalChunks=0;var ops=[];var opsMeta=[];
  groupData.forEach(function(g){
    totalChunks+=g.pcbc.length;
    opsMeta.push({file_name:g.file_name,target_area:g.target_area,srows:g.srows});
    ops.push(enqueue("import_commit",{file_name:g.file_name,kind:"applicants",target_area:g.target_area,rows:g.srows,preview_counts_by_chunk:g.pcbc}));
  });
  try{var slot=document.getElementById("impResult");if(slot)slot.innerHTML='<div class="card"><h3>サーバーへ反映中</h3><p id="importProgress">サーバーへ反映中: 0 / '+totalChunks+' チャンク</p><p class="small">チャンクは前の完了を待ってから順に送ります。画面を閉じないでください。</p></div>'}catch(e){}
  try{pollImportStatusDuringCommit_()}catch(e){}
  Promise.all(ops).then(function(doneOps){
    var agg=aggregateImportResults(doneOps);window._lastImportResult=agg;
    try{persistFailedImportChunks65_(doneOps,opsMeta)}catch(e){}
    if(state.imports&&state.imports[0]){
      state.imports[0].server=agg.server;state.imports[0].sync=agg.sync;
      var hu=importHistoryFromServer65(counts,agg);
      if(hu){
        state.imports[0].new=hu.new;state.imports[0].latest=hu.latest;state.imports[0].updated=hu.updated;
        state.imports[0].skip=hu.skip;state.imports[0].excluded=hu.excluded;state.imports[0].failed=hu.failed;
        if(hu.diff_note)state.imports[0].diff_note=hu.diff_note;
      }
      saveAll();
    }
    window._r6ListCache={key:"",items:[],total:null,loading:false,error:""};
    fetchApplicantSummaryR6_();
    if(agg.sync==="failed"){
      var fe=(doneOps||[]).find(function(o){return o&&o.status==="failed"});
      showToast(translateImportError65(fe&&fe.error),"bad");
    }
    else if(agg.sync==="partial")showToast("一部のチャンクが完了しませんでした。取り込み画面の「取り込みの確認・再実行」から、そのチャンクだけ再実行できます","warn");
    else if(agg.server)showToast("サーバー実績と一致しました");
    importCommitting=false;
    try{route()}catch(e){}
  }).catch(function(){importCommitting=false});
};

/* --- 大ファイルのキュー方式 (R6.5 速度要件): 全チャンクをサーバーへ登録だけし、
   実際の取り込みはサーバー側の継続処理に任せる。opId はファイル内容ハッシュ由来にし、
   登録が途中で失敗しても同じファイルの再確定で未登録分だけ続きから登録される
   (サーバー側が client_op_id / chunk_seq で重複を弾く)。 --- */
function commitImportViaQueue65_(snap,counts,groupData){
  var opIds=groupData.map(function(g,i){
    var pf=(window._importPerFile||[])[i];
    var h=pf&&pf.hash?String(pf.hash):"";
    if(h)return "OPQ"+h+"_"+g.srows.length;
    return "OP"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2,7);
  });
  if(state.imports&&state.imports[0]){state.imports[0].sync="queued";state.imports[0].queue_ops=opIds;saveAll()}
  var jobs=[];
  groupData.forEach(function(g,gi){
    for(var s=0,seq=0;s<g.srows.length;s+=500,seq++){
      jobs.push({opId:opIds[gi],seq:seq,req:{action:"importEnqueue",file_name:g.file_name,kind:"applicants",target_area:g.target_area,rows:g.srows.slice(s,s+500),client_op_id:opIds[gi],chunk_seq:seq,preview_counts:g.pcbc[seq]}});
    }
  });
  try{var slot=document.getElementById("impResult");if(slot)slot.innerHTML='<div class="card"><h3>サーバーへ登録中</h3><p id="importProgress">サーバーへ登録中: 0 / '+jobs.length+' チャンク</p><p class="small">登録が終われば、アプリを閉じてもサーバー側で取り込みが最後まで進みます。</p></div>'}catch(e){}
  var done=0,failMsg="";
  var chain=Promise.resolve();
  jobs.forEach(function(j){
    chain=chain.then(function(){
      return apiCall(j.req).then(function(){done++}).catch(function(e){if(!failMsg)failMsg=String(e&&e.message||e||"")});
    }).then(function(){
      try{var el=document.getElementById("importProgress");if(el)el.textContent="サーバーへ登録中: "+done+" / "+jobs.length+" チャンク"}catch(e){}
    });
  });
  chain.then(function(){
    importCommitting=false;
    if(failMsg){
      if(state.imports&&state.imports[0]){state.imports[0].sync="queue_failed";saveAll()}
      showToast(translateImportError65(failMsg)+"（登録できなかったチャンクがあります。同じファイルでもう一度確定すると、未登録分だけ続きから登録されます）","bad");
    }else{
      showToast("サーバーに登録しました。アプリを閉じても処理が続きます（進捗は取り込み画面で確認できます）");
      pollImportQueueUntilDone65_(opIds,jobs.length);
    }
    try{route()}catch(e){}
  }).catch(function(){importCommitting=false});
}

/* キュー処理の完了を見届けて履歴をサーバー実績で確定する (アプリを開いている間だけ)。
   閉じていてもサーバー側のバッチ記録が正であり、取り込み画面で確認できる。 */
function pollImportQueueUntilDone65_(opIds,chunkCount){
  var startedAt=Date.now();
  function check(){
    fetchImportStatusR6_().then(function(st){
      if(!st)return;
      var mine=(st.batches||[]).filter(function(b){return opIds.indexOf(b.client_op_id)>=0});
      var finished=mine.filter(function(b){return b.status==="complete"||b.status==="partial"||b.status==="failed"}).length;
      var q=st.queue||{pending_rows:1,processing_rows:0};
      if(finished>=chunkCount&&!q.pending_rows&&!q.processing_rows){
        var agg={server:{added:0,updated:0,skipped:0,failed:0},sync:mine.some(function(b){return b.status!=="complete"})?"partial":"ok"};
        mine.forEach(function(b){agg.server.added+=b.added||0;agg.server.updated+=b.updated||0;agg.server.skipped+=b.skipped||0;agg.server.failed+=b.failed||0;if(typeof b.attr_updated==="number")agg.server.attr_updated=(agg.server.attr_updated||0)+b.attr_updated});
        if(state.imports&&state.imports[0]&&state.imports[0].queue_ops&&state.imports[0].queue_ops.join()===opIds.join()){
          var hu=importHistoryFromServer65(state.imports[0].preview_counts,agg);
          if(hu){
            state.imports[0].new=hu.new;state.imports[0].latest=hu.latest;state.imports[0].updated=hu.updated;
            state.imports[0].skip=hu.skip;state.imports[0].excluded=hu.excluded;state.imports[0].failed=hu.failed;
            state.imports[0].server=agg.server;
            state.imports[0].diff_note=(hu.diff_note?hu.diff_note+" ":"")+"（最新応募と属性更新の内訳はプレビュー時のサーバー照合に基づきます。合計はサーバー実績です）";
          }
          state.imports[0].sync=agg.sync;
          saveAll();
        }
        showToast(agg.sync==="ok"?"サーバー側の取り込みが完了しました":"サーバー側の取り込みが一部失敗で完了しました。取り込み画面で確認してください",agg.sync==="ok"?undefined:"warn");
        return;
      }
      if(Date.now()-startedAt<30*60*1000)setTimeout(check,15000);
    }).catch(function(){});
  }
  check();
}

/* --- viewImport の差し替え: 中断・一部失敗バッチの表示とチャンク再実行 --- */
var _r65PrevViewImport=viewImport;

        var html='<div style="border-top:1px solid #ddd;padding:6px 0"><p class="small"><b>'+esc(b.file_name||"")+"</b>（チャンク "+(Number(b.chunk_seq||0)+1)+"）: "+statusLabel+" / 新規 "+(b.added||0)+" ・ 更新 "+(b.updated||0)+" ・ 除外 "+(b.skipped||0)+" ・ 失敗 "+(b.failed||0)+"</p>";
        if(note)html+='<p class="small">'+esc(note)+"</p>";
        if(actionable){
          var found=b.client_op_id?findImportChunkRows65(b.client_op_id,b.chunk_seq):null;
          if(found)html+='<button class="primary" onclick="retryImportChunk65(\''+esc(b.client_op_id)+"',"+Number(b.chunk_seq||0)+')">このチャンクだけ再実行</button>';
          else html+='<p class="small">このチャンクのデータはこの端末に残っていません。元のCSVファイルから再取り込みしてください（取り込み済みの行は二重登録されません）。</p>';
        }
        html+="</div>";
        items.push(html);
      });
      var q=st.queue||null;
      if(q&&(q.pending_rows||q.processing_rows)){
        items.unshift('<p class="small">サーバー側で取り込み処理中: 残り '+q.pending_chunks+' チャンク（'+q.pending_rows+' 行）'+(q.processing_rows?' ・ 処理中 '+q.processing_rows+' 行':'')+'。アプリを閉じても処理は続きます。</p>');
      }
      var latestDiff=(state.imports&&state.imports[0]&&state.imports[0].diff_note)||"";
      if(!items.length&&!latestDiff)return;
      app.insertAdjacentHTML("beforeend",'<div class="card"><h3>取り込みの確認・再実行</h3>'+(latestDiff?'<p class="small">'+esc(latestDiff)+"</p>":"")+items.join("")+"</div>");
    }catch(e){}
  });
};

<script>
/* ===== ラウンド7: 特需・逆引き・掘り起こしのサーバー検索化 =====
   R6 で一覧・集計・回答はサーバー化されたが、特需SMS (special)・案件から探す
   (reverse)・掘り起こし (dig) の3ビューは端末側プール (applicants 全件) を
   前提に残っていた。サーバーモードでは端末に全件が無いため、3ビューは
   サーバー検索 (searchSpecialCandidates / searchReverseCandidates /
   getDigTodayList / getDigSegment / getDigStats) でページ単位に取得する。
   業務ルール (絞り込み・除外・並び・逆算理由) はサーバー側が正本で、
   フロント現行実装と同一にしてある (Code.gs の各アクションのコメント参照)。
   サーバーモードでない場合は従来の端末プール実装をそのまま使う。 */
window._r7Special={key:"",counts:{},items:[],total:null,loading:false,error:""};
window._r7Reverse={key:"",items:[],total:null,facets:null,loading:false,error:""};
window._r7Dig={key:"",today:null,seg:null,stats:null,loading:false,error:""};
window._r7Facets={};
window._r7SpecialWant=50;
window._r7ReverseWant=100;
window._r7DigWant=50;
window._r7MergedIds=[];
var R7_POOL_CAP=600;
/* サーバーのカード用アイテム (電話つき) を端末レコード形へ変換する */
function r7ToLocal(it){
  if(!it||typeof it!=="object")return null;
  var a=serverApplicantToLocal(it);if(!a)return null;
  if(it.phone!=null)a.phone=String(it.phone||"");
  if(it.dist!=null&&it.dist!=="")a.dist=Number(it.dist);
  if(it.match!=null&&it.match!=="")a.match=Number(it.match);
  if(it.age!=null&&it.age!=="")a._r7Age=Number(it.age);
  if(Array.isArray(it.reasons))a._digReasons=it.reasons.slice();
  return a;
}
/* 取得したページ分だけを端末プールへ寄せる (詳細・送信記録などの既存ハンドラが
   applicants.find で引けるようにするため)。全件は保持せず、R7 で寄せた分が
   上限を超えたら古い順に外す。サーバーモードでは永続化されない。 */
function r7MergePool(items){
  if(!Array.isArray(items))return;
  var byId={};for(var i=0;i<applicants.length;i++)byId[applicants[i].id]=applicants[i];
  items.forEach(function(a){
    if(!a||!a.id)return;
    var ex=byId[a.id];
    if(ex){Object.keys(a).forEach(function(k){ex[k]=a[k]})}
    else{applicants.push(a);byId[a.id]=a;window._r7MergedIds.push(a.id)}
  });
  while(window._r7MergedIds.length>R7_POOL_CAP){
    var dropId=window._r7MergedIds.shift();var ix=-1;
    for(var j=0;j<applicants.length;j++)if(applicants[j].id===dropId){ix=j;break}
    if(ix>=0)applicants.splice(ix,1);
  }
}
function r7MaxAgeOf(c){return (c.maxAge===""||c.maxAge==null)?null:c.maxAge}
function r7CampaignCountKey(c){return [state.area,c.id,c.lat,c.lon,c.radius,c.job_type,r7MaxAgeOf(c)].join("|")}
function r7SpecialKey(c){return r7CampaignCountKey(c)+"|"+window._r7SpecialWant}
function fetchSpecialR7_(){
  if(typeof apiCall!=="function")return null;
  var cache=window._r7Special;
  var jobs=[];
  state.campaigns.forEach(function(c){
    var ck=r7CampaignCountKey(c);
    if(cache.counts[ck]==null&&!cache["cload:"+ck]){
      cache["cload:"+ck]=true;
      jobs.push(apiCall({action:"searchSpecialCandidates",lat:c.lat,lon:c.lon,radius_km:c.radius,job_type:c.job_type,area:state.area,max_age:r7MaxAgeOf(c),count_only:true}).then(function(res){
        cache.counts[ck]=(res&&typeof res.total==="number")?res.total:0;
      }).catch(function(){cache.counts[ck]=0}).then(function(){delete cache["cload:"+ck]}));
    }
  });
  var sel=state.campaigns.find(function(x){return x.id===state.selectedCampaignId})||state.campaigns[0];
  if(sel){
    var key=r7SpecialKey(sel);
    if(cache.key!==key){cache={key:key,counts:cache.counts,items:[],total:null,loading:false,error:""};window._r7Special=cache}
    if(!cache.loading&&cache.total==null){
      cache.loading=true;
      var want=window._r7SpecialWant;var acc=[];var total=null;
      var step=function(page){
        return apiCall({action:"searchSpecialCandidates",lat:sel.lat,lon:sel.lon,radius_km:sel.radius,job_type:sel.job_type,area:state.area,max_age:r7MaxAgeOf(sel),page:page,page_size:50}).then(function(res){
          var raw=(res&&Array.isArray(res.items))?res.items:[];
          if(res&&typeof res.total==="number")total=res.total;
          raw.forEach(function(it){var a=r7ToLocal(it);if(a)acc.push(a)});
          if(acc.length<want&&raw.length===50&&(total==null||acc.length<total))return step(page+1);
          return {items:acc.slice(0,want),total:(total==null?acc.length:total)};
        });
      };
      jobs.push(step(1).then(function(res){
        cache.items=res.items;cache.total=res.total;cache.loading=false;r7MergePool(res.items);
      }).catch(function(e){cache.loading=false;cache.error=String(e&&e.message||e)}));
    }
  }
  if(jobs.length)return Promise.all(jobs).then(function(){if((location.hash||"").indexOf("#/list")===0)route()});
  return null;
}
var _r7PrevSpecialView=specialView;
specialView=function(list){
  if(!window._r6ServerMode)return _r7PrevSpecialView(list);
  fetchSpecialR7_();
  var cache=window._r7Special;
  var sel=state.campaigns.find(function(x){return x.id===state.selectedCampaignId})||state.campaigns[0];
  var prevSC=specialCandidates;
  specialCandidates=function(c){
    if(sel&&c&&c.id===sel.id){
      return cache.items.map(function(a){var o={};Object.keys(a).forEach(function(k){o[k]=a[k]});o.dist=a.dist;o.age=(a._r7Age!=null?a._r7Age:ageOf(a.birth_date));return o});
    }
    var n=cache.counts[r7CampaignCountKey(c)];
    return n==null?[]:new Array(n);
  };
  var html;
  try{html=_r7PrevSpecialView(list)}finally{specialCandidates=prevSC}
  if(cache.total!=null&&cache.total!==cache.items.length){
    html=html.split("の対象 "+cache.items.length+"名（直近応募順").join("の対象 "+cache.total+"名（直近応募順");
    html=html.split("対象 "+cache.items.length+"名／未記録").join("対象 "+cache.total+"名／未記録");
  }
  if(cache.loading)html='<p class="small">サーバーから対象を読み込み中…</p>'+html;
  if(cache.error)html='<div class="card"><p>サーバー検索に失敗しました: '+esc(cache.error)+'</p><button onclick="window._r7Special={key:\'\',counts:{},items:[],total:null,loading:false,error:\'\'};route()">再試行</button></div>'+html;
  if(sel&&cache.total!=null&&cache.total>cache.items.length){
    html+='<button class="primary" style="width:100%" onclick="window._r7SpecialWant+=50;route()">さらに50件表示（対象 '+cache.total+'名中 '+cache.items.length+'名を表示中）</button>';
  }
  return html;
};
/* --- 逆引き --- */
function r7ReverseCaseKey(c){return [c.id,c.lat,c.lon,c.job_type,c.prefecture].join("|")}
function r7ReverseKey(c){return [r7ReverseCaseKey(c),state.reverseRadius||5,state.reverseCond||"",state.reverseMuni||"",state.reverseWideMuni?1:0,state.reverseIncludeConsult?1:0,window._r7ReverseWant].join("|")}
function fetchReverseR7_(c){
  if(typeof apiCall!=="function")return;
  var cache=window._r7Reverse;var key=r7ReverseKey(c);
  if(cache.key!==key){cache={key:key,items:[],total:null,facets:null,loading:false,error:""};window._r7Reverse=cache}
  if(cache.loading||cache.total!=null)return;
  cache.loading=true;

<script>
/* ===== 案件取り込み修正 (C-1〜C-6) =====

   - 案A (C-1): source_case_key に形態・時給を含め、生成側の重複排除キー
     (施設名・住所・職種・形態・時給の完全一致) と一致させる。従来キーは

   - 案B (C-2/C-4/C-6): 案件も応募者と同じ堅牢化経路に載せる。確定は単一op

     キュー方式。サーバー側は importCasesCommitCore_ がチャンクごとに
     cases / case_sources を1回だけ読んで照合する。進捗・実績は
     import_batches (kind='cases') と getImportStatus で確認でき、失敗
     チャンクはそのチャンクだけ再実行できる。
   - 案C (C-3): 案件プレビューにも R6.5 の厳密検証 (strictParseCsv65 +
     案件用バリデータ) を適用し、問題ファイルは行番号つきで隔離する。
   - C-5: サーバーモードではプレビューの重複判定をサーバーの登録済みキー
     (getCaseSourceKeys, source='csv') と照合する。取得できない場合は

     確定後のサーバー総数で行う。

/* --- 案A: 冪等キーの生成 (生成側の重複排除キーと同一形式) --- */
function caseSourceKeyCsv_(facility,address,jobType,service,salary){
  return String(facility||"").replace(/[\s\u3000]/g,"")+"|"+(address||"")+"|"+(jobType||"")+"|"+(service||"")+"|"+(salary||"");
}

/* --- 厳密パース済みの行配列に対する案件列マッピング (parseCaseCsv と同じ判定) --- */
function parseCaseCsvRows_(rows){
  if(!rows||rows.length<2)return[];
  const head=rows[0].map(h=>String(h).replace(/^\uFEFF+/,"").trim());
  const find=keys=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const ix={facility:find(["施設名","施設","案件名"]),address:find(["住所","所在地"]),job:find(["職種"]),service:find(["形態","サービス"]),salary:find(["時給","給与"]),acquired:find(["取得日","登録日","日付"]),lat:find(["緯度","lat"]),lon:find(["経度","lon","lng"]),prefecture:find(["都道府県"]),municipality:find(["市区町村","市町村"])};

/* --- 案件CSVの事前検証 (validateImportData65 の案件版: 列数・引用符・必須列) --- */
function validateCaseImportData65(rows,diag){
  var errors=[];
  if(!rows||!rows.length){errors.push("ファイルにデータ行がありません（空のファイルです）。中身のあるCSVを選んでください");return {errors:errors,warnings:[]}}
  var head=rows[0].map(function(h){return String(h==null?"":h).replace(/^\uFEFF+/,"").trim()});
  var norm=function(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000]/g,"")};
  var seen={},dups=[];
  head.forEach(function(h){var n=norm(h);if(!n)return;if(seen[n]&&dups.indexOf(h)<0)dups.push(h);seen[n]=true});
  if(dups.length)errors.push("見出し（ヘッダー）が重複しています: "+dups.join("、")+"。同じ名前の列が2つあると、どちらの列を使うか判断できません。元のシステムで列名を分けてから取り込んでください");
  var dataCount=rows.length-1;
  if(dataCount>R65_MAX_FILE_ROWS)errors.push("データ行が "+dataCount+" 行あります（上限は "+R65_MAX_FILE_ROWS+" 行です）。"+Math.ceil(dataCount/15000)+" 個くらいに分割してから取り込んでください（目安: 15,000行ずつ）");
  if(diag&&diag.unclosedQuoteLine)errors.push(diag.unclosedQuoteLine+" 行目で始まる引用符（\"）が閉じていません。その行のセルを確認してください（セル内に \" がある場合は \"\" と二重にするか、セル全体を \" で囲ってください）");
  if(diag&&diag.colMismatches&&diag.colMismatches.length){
    var ms=diag.colMismatches;
    var shown=ms.slice(0,5).map(function(m){return m.line+"行目（"+m.actual+"列／ヘッダーは"+m.expected+"列）"}).join("、");
    errors.push("列数がヘッダーと合わない行があります: "+shown+(ms.length>5?"、ほか"+(ms.length-5)+"件":"")+"。セル内のカンマが引用符で囲われていないか、カンマの入れ忘れがないか確認してください");
  }
  var find=function(keys){return head.findIndex(function(h){return keys.some(function(k){return h.includes(k)})})};
  if(find(["施設名","施設","案件名"])<0)errors.push("施設名の列が見つかりません。見出しに「施設名」を含む列が必要です");
  if(find(["住所","所在地"])<0)errors.push("住所の列が見つかりません。見出しに「住所」を含む列が必要です（地域の判定に使います）");
  if(find(["職種"])<0)errors.push("職種の列が見つかりません。見出しに「職種」を含む列が必要です");
  return {errors:errors,warnings:[]};
}

/* --- C-5: サーバーの登録済みキー (source='csv') を取得する。失敗時は null --- */
function fetchCaseServerKeysCsv_(){

/* --- previewCaseImport の差し替え: 厳密検証で問題ファイルを隔離し、
       サーバーモードでは重複判定をサーバーの実案件キーと照合する --- */
var _cfPrevPreviewCaseImport=previewCaseImport;
previewCaseImport=function(){
  const inp=document.getElementById("caseFiles");
  const files=inp?[...inp.files]:[];
  if(!files.length){alert("案件CSVファイルを選んでください");return}
  (async()=>{
    window._caseBlocked65=[];window._caseWarnings65=[];
    const groups=[];let allJudged=[];
    for(const f of files){
      let text=null;
      try{text=await decodeFile(f)}catch(e){text=null}
      if(typeof text!=="string"){
        window._caseBlocked65.push({file:f.name,errors:["ファイルを読み取れませんでした。もう一度選んでください"]});
        continue;
      }
      const errs=[];
      const dec=window._r65LastDecode||{};
      if(dec.ctrl>0)errs.push("文字コードを判定できませんでした（判別できない文字が含まれています）。Excelで開いて「CSV UTF-8」または「Shift-JIS」で保存し直してください");
      else if(dec.fffd>=3)errs.push("文字コードを判定できませんでした（一部の文字が化けています）。UTF-8かShift-JISで保存し直してください");
      const strict=strictParseCsv65(text);
      const v=validateCaseImportData65(strict.rows,strict.diag);
      v.errors.forEach(function(m){errs.push(m)});
      if(errs.length){window._caseBlocked65.push({file:f.name,errors:errs});continue}
      if(dec.fffd>0)window._caseWarnings65.push({file:f.name,message:"一部の文字が置き換え文字になっています（"+dec.fffd+"文字）。文字コードを確認してください"});
      const judged=parseCaseCsvRows_(strict.rows).map(r=>({r,j:judgeCaseRow(r)}));
      groups.push({file_name:f.name,judged});allJudged.push(...judged);
    }
    let serverKeys=null;
    if(window._r6ServerMode&&allJudged.length)serverKeys=await fetchCaseServerKeysCsv_();
    if(serverKeys){
      for(const x of allJudged){
        if(!x.j.ok)continue;
        const key=caseSourceKeyCsv_(x.r.facility,x.r.address,x.j.job_type,x.r.service,x.r.salary);
        x.j.dup=serverKeys[key]?"server":null;
      }
    }
    caseImportPreview={judged:allJudged,groups:groups,serverKeys:!!serverKeys};
    const judged=allJudged;
    const ok=judged.filter(x=>x.j.ok),dups=ok.filter(x=>x.j.dup),news=ok.filter(x=>!x.j.dup);
    const ng=judged.filter(x=>!x.j.ok);
    let coordHas=0,coordRep=0,coordNone=0,coordDown=0;const downReasons={};
    for(const x of ok){const r=x.r;const chk=coordBasicCheck(r.lat,r.lon);if(chk.state==="ok"){const pc=coordPrecisionCheck(chk.lat,chk.lon,muniRepPoint(x.j.pref,x.j.muni),null);if(pc.precise){coordHas++;continue}coordDown++;downReasons[pc.reason]=(downReasons[pc.reason]||0)+1;continue}if(chk.state==="invalid"){coordDown++;downReasons[chk.reason]=(downReasons[chk.reason]||0)+1;continue}const rep=muniRepPoint(x.j.pref,x.j.muni);if(rep)coordRep++;else coordNone++}
    const slot=document.getElementById("caseImpResult");
    if(!slot)return;
    if(!judged.length){
      slot.innerHTML=renderCaseImportIssues65_()+'<div class="card"><h3>案件取り込み 確認画面</h3><p>取り込めるファイルがありませんでした。上の理由を直してから、もう一度選んでください。</p></div>';
      return;
    }
    slot.innerHTML=renderCaseImportIssues65_()+`<h3>案件取り込み 確認画面（まだ反映していません）</h3><p>読込 ${judged.length}件 ／ 新規 ${news.length}件 ／ 既存と重複（サーバーで更新として処理） ${dups.length}件 ／ 除外 ${ng.length}件</p><p class="small">座標の内訳（取り込み対象 ${ok.length}件）: 精密座標あり ${coordHas}件 ／ 検証で降格 ${coordDown}件${coordDown?`（${Object.entries(downReasons).map(([k,v])=>k+" "+v+"件").join("・")}）`:""} ／ 市区町村代表点で補完 ${coordRep}件 ／ 座標不明 ${coordNone}件（座標不明の案件は距離が測れないため、おすすめでは「距離不明」として扱います）</p><p class="small">除外理由別: ${ng.map(x=>x.j.reason).filter((v,i,arr)=>arr.indexOf(v)===i).map(k=>k+" "+ng.filter(x=>x.j.reason===k).length+"件").join(" ／ ")||"なし"}。地域は住所（都道府県）から自動判定しています。</p><p class="small">${serverKeys?"重複判定はサーバーの登録済みキーと照合しています。":"重複判定は端末内の案件のみが対象です。"}最終的な件数は、確定後にサーバー総数で照合します。</p><button class="primary" onclick="commitCaseImport()">確定で反映</button>`;
  })();
};

/* --- commitCaseImport の差し替え: サーバーモードでは堅牢化経路
       (チャンク確定 / キュー方式) に載せ替える。非サーバーモードは従来経路 --- */
var _cfPrevCommitCaseImport=commitCaseImport;
commitCaseImport=function(){
  if(!window._r6ServerMode)return _cfPrevCommitCaseImport();
  if(caseCommitting)return;
  if(!caseImportPreview)return;
  const snap=caseImportPreview;caseImportPreview=null;
  /* 表示用の先行反映 (従来どおり新規判定分のみ。C-7 残範囲) */
  let n=0;
  for(const x of snap.judged){if(!x.j.ok||x.j.dup)continue;CASES.unshift(buildCaseLocalRow_(x.r,x.j,n));n++}
  const groups=snap.groups&&snap.groups.length?snap.groups:[{file_name:"",judged:snap.judged}];
  const groupData=[];let totalRows=0;
  groups.forEach(function(g){
    const okRows=(g.judged||[]).filter(function(x){return x.j.ok});
    if(!okRows.length)return;
    const srows=okRows.map(function(x){return buildCaseServerRow_(x.r,x.j)});
    const pcbc=[];
    for(let s=0;s<srows.length;s+=500){
      const pc={added:0,updated:0,skipped:0};
      okRows.slice(s,s+500).forEach(function(x){if(x.j.dup)pc.updated++;else pc.added++});
      pcbc.push(pc);
    }
    groupData.push({file_name:g.file_name||"",srows:srows,pcbc:pcbc});
    totalRows+=srows.length;
  });
  if(!totalRows){showToast("取り込む案件がありませんでした");try{route()}catch(e){}return}
  if(totalRows>R65_QUEUE_THRESHOLD){commitCaseImportViaQueue_(groupData,totalRows);return}
  commitCaseImportDirect_(groupData,totalRows);
};

/* --- 直接確定 (1,000行以下): 500件チャンクの import_commit を直列に送る --- */
function commitCaseImportDirect_(groupData,totalRows){
  caseCommitting=true;
  const totalChunks=groupData.reduce(function(a,g){return a+g.pcbc.length},0);
  const ops=[],opsMeta=[];
  groupData.forEach(function(g){
    opsMeta.push({file_name:g.file_name,target_area:state.area,srows:g.srows,kind:"cases"});
    ops.push(enqueue("import_commit",{file_name:g.file_name,kind:"cases",target_area:state.area,rows:g.srows,preview_counts_by_chunk:g.pcbc}));
  });
  try{const slot=document.getElementById("caseImpResult");if(slot)slot.innerHTML='<div class="card"><h3>サーバーへ反映中</h3><p id="caseImportProgress">サーバーへ反映中: 0 / '+totalChunks+' チャンク</p><p class="small">チャンクは前の完了を待ってから順に送ります。画面を閉じないでください。</p></div>'}catch(e){}
  let doneChunks=0;
  ops.forEach(function(p){Promise.resolve(p).then(function(done){
    doneChunks+=(done&&Array.isArray(done.results))?done.results.length:0;
    try{const el=document.getElementById("caseImportProgress");if(el)el.textContent="サーバーへ反映中: "+doneChunks+" / "+totalChunks+" チャンク"}catch(e){}
  },function(){})});
  Promise.all(ops).then(function(doneOps){
    const agg=aggregateImportResults(doneOps);window._lastCaseImportResult=agg;
    try{persistFailedImportChunks65_(doneOps,opsMeta)}catch(e){}
    try{fetchImportStatusR6_()}catch(e){}
    if(agg.sync==="failed"){
      const fe=(doneOps||[]).find(function(o){return o&&o.status==="failed"});
      showToast(translateImportError65(fe&&fe.error),"bad");
    }else if(agg.sync==="partial"){
      showToast("一部のチャンクが完了しませんでした。取り込み画面の「取り込みの確認・再実行」から、そのチャンクだけ再実行できます","warn");
    }else if(agg.server){
      showToast("案件を取り込みました: 新規 "+agg.server.added+" / 更新 "+agg.server.updated);
    }
    caseCommitting=false;
    try{route()}catch(e){}
  }).catch(function(){caseCommitting=false});
}

/* --- キュー方式 (1,000行超): 全チャンクを登録だけし、処理はサーバー側に任せる。
       opId はファイル内容由来にし、再確定では未登録分だけ続きから登録される --- */
function caseFileHash_(name,srows){
  const s=String(name||"")+"#"+srows.length+"#"+(srows.length?srows[0].source_case_key:"")+"#"+(srows.length?srows[srows.length-1].source_case_key:"");
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return ("0000000"+h.toString(16)).slice(-8);
}
function commitCaseImportViaQueue_(groupData,totalRows){
  caseCommitting=true;
  const opIds=groupData.map(function(g){return "OPQ"+caseFileHash_(g.file_name,g.srows)+"_"+g.srows.length});
  const jobs=[];
  groupData.forEach(function(g,gi){
    for(let s=0,seq=0;s<g.srows.length;s+=500,seq++){
      jobs.push({opId:opIds[gi],seq:seq,req:{action:"importEnqueue",file_name:g.file_name,kind:"cases",target_area:state.area,rows:g.srows.slice(s,s+500),client_op_id:opIds[gi],chunk_seq:seq,preview_counts:g.pcbc[seq]}});
    }
  });
  try{const slot=document.getElementById("caseImpResult");if(slot)slot.innerHTML='<div class="card"><h3>サーバーへ登録中</h3><p id="caseImportProgress">サーバーへ登録中: 0 / '+jobs.length+' チャンク</p><p class="small">登録が終われば、アプリを閉じてもサーバー側で取り込みが最後まで進みます。</p></div>'}catch(e){}
  let done=0,failMsg="";
  let chain=Promise.resolve();
  jobs.forEach(function(j){
    chain=chain.then(function(){
      return apiCall(j.req).then(function(){done++}).catch(function(e){if(!failMsg)failMsg=String(e&&e.message||e||"")});
    }).then(function(){
      try{const el=document.getElementById("caseImportProgress");if(el)el.textContent="サーバーへ登録中: "+done+" / "+jobs.length+" チャンク"}catch(e){}
    });
  });
  chain.then(function(){
    caseCommitting=false;
    if(failMsg){
      showToast(translateImportError65(failMsg)+"（登録できなかったチャンクがあります。同じファイルでもう一度確定すると、未登録分だけ続きから登録されます）","bad");
    }else{
      showToast("サーバーに登録しました。アプリを閉じても処理が続きます（進捗は取り込み画面で確認できます）");
      pollCaseImportQueue_(opIds,jobs.length);
    }
    try{route()}catch(e){}
  }).catch(function(){caseCommitting=false});
}

/* キュー処理の完了を見届ける (アプリを開いている間だけ。閉じていても
   サーバー側のバッチ記録が正であり、取り込み画面で確認できる) */
function pollCaseImportQueue_(opIds,chunkCount){
  const startedAt=Date.now();
  function check(){
    fetchImportStatusR6_().then(function(st){
      if(!st)return;
      const mine=(st.batches||[]).filter(function(b){return b.kind==="cases"&&opIds.indexOf(b.client_op_id)>=0});
      const finished=mine.filter(function(b){return b.status==="complete"||b.status==="partial"||b.status==="failed"}).length;
      const q=st.queue||{pending_rows:1,processing_rows:0};
      if(finished>=chunkCount&&!q.pending_rows&&!q.processing_rows){
        const bad=mine.some(function(b){return b.status!=="complete"});
        const added=mine.reduce(function(a,b){return a+(b.added||0)},0);
        const updated=mine.reduce(function(a,b){return a+(b.updated||0)},0);
        showToast(bad?"サーバー側の案件取り込みが一部失敗で完了しました。取り込み画面で確認してください":"サーバー側の案件取り込みが完了しました: 新規 "+added+" / 更新 "+updated,bad?"warn":undefined);
        return;
      }
      if(Date.now()-startedAt<30*60*1000)setTimeout(check,15000);
    }).catch(function(){});
  }
  check();
}

/* --- opToRequests の差し替え: import_commit の kind を payload から引き継ぐ
       (payload に kind が無い従来の応募者経路は 'applicants' のまま) --- */
var _cfPrevOpToRequests=opToRequests;
opToRequests=function(op){
  var reqs=_cfPrevOpToRequests(op);
  try{
    if(op&&op.type==="import_commit"&&op.payload&&op.payload.kind&&Array.isArray(reqs)){
      reqs.forEach(function(r){r.kind=op.payload.kind});
    }
  }catch(e){}
  return reqs;
};

/* --- 失敗チャンクの保存に kind を残す (再実行で案件/応募者を取り違えない) --- */
var _cfPrevPersistFailedImportChunks65=persistFailedImportChunks65_;
persistFailedImportChunks65_=function(doneOps,opsMeta){
  _cfPrevPersistFailedImportChunks65(doneOps,opsMeta);
  try{
    var kindByOp={};
    (doneOps||[]).forEach(function(op,oi){
      var meta=opsMeta&&opsMeta[oi];
      if(op&&op.opId&&meta&&meta.kind)kindByOp[op.opId]=meta.kind;
    });
    if(!Object.keys(kindByOp).length)return;
    var store=r65LoadChunkStore_();var changed=false;
    store.forEach(function(e){if(kindByOp[e.opId]&&e.kind!==kindByOp[e.opId]){e.kind=kindByOp[e.opId];changed=true}});
    if(changed)r65SaveChunkStore_(store);
  }catch(e){}
};

/* --- findImportChunkRows65 の差し替え: チャンクの kind も返す --- */
var _cfPrevFindImportChunkRows65=findImportChunkRows65;
findImportChunkRows65=function(clientOpId,seq){
  var found=_cfPrevFindImportChunkRows65(clientOpId,seq);
  if(!found)return found;
  var kind="";
  try{
    var ops=(typeof outbox!=="undefined"&&Array.isArray(outbox))?outbox:[];
    for(var i=0;i<ops.length;i++){
      var op=ops[i];
      if(op&&op.opId===clientOpId&&op.type==="import_commit"&&op.payload&&op.payload.kind){kind=op.payload.kind;break}
    }
    if(!kind){
      var store=r65LoadChunkStore_();
      for(var j=0;j<store.length;j++){
        if(store[j].opId===clientOpId&&Number(store[j].chunk_seq)===Number(seq)&&store[j].kind){kind=store[j].kind;break}
      }
    }
  }catch(e){}
  found.kind=kind||"applicants";
  return found;
};

/* --- retryImportChunk65 の差し替え: 案件チャンクは kind='cases' で再実行する
       (応募者チャンクは従来の実装にそのまま委譲する) --- */
var _cfPrevRetryImportChunk65=retryImportChunk65;
retryImportChunk65=function(clientOpId,seq){
  seq=Number(seq);
  var found=findImportChunkRows65(clientOpId,seq);
  if(!found||found.kind!=="cases")return _cfPrevRetryImportChunk65(clientOpId,seq);
  try{
    var orig=(typeof outbox!=="undefined"?outbox:[]).find(function(o){return o&&o.opId===clientOpId&&o.type==="import_commit"});
    if(orig&&orig.payload&&Array.isArray(orig.payload.rows)&&orig.payload.rows.length>500){
      var store=r65LoadChunkStore_();
      for(var s=0;s*500<orig.payload.rows.length;s++){
        if(!store.some(function(e){return e.opId===clientOpId&&Number(e.chunk_seq)===s})){
          store.push({opId:clientOpId,chunk_seq:s,kind:"cases",file_name:orig.payload.file_name||"",target_area:orig.payload.target_area||"",rows:orig.payload.rows.slice(s*500,s*500+500),at:new Date().toISOString()});
        }
      }
      while(store.length>12)store.shift();
      r65SaveChunkStore_(store);
    }
  }catch(e){}
  var op={opId:clientOpId,type:"import_commit",payload:{file_name:found.file_name,kind:"cases",target_area:found.target_area||state.area,rows:found.rows,chunk_seq_offset:seq},at:new Date().toISOString(),status:"pending"};
  showToast("チャンクを再実行しています…");
  API.commit(op).then(function(done){
    if(done&&done.status==="done"){
      var r=(done.results&&done.results[0])||{};
      if(r.status==="complete"){
        var store=r65LoadChunkStore_().filter(function(e){return !(e.opId===clientOpId&&Number(e.chunk_seq)===seq)});
        r65SaveChunkStore_(store);
      }
      showToast("チャンクを再実行しました: 新規 "+(r.added||0)+" / 更新 "+(r.updated||0)+" / 除外 "+(r.skipped||0)+(r.status==="partial"?"（一部失敗が残っています）":""));
    }else{
      showToast(translateImportError65(done&&done.error),"bad");
    }
    try{fetchImportStatusR6_()}catch(e){}
    try{route()}catch(e){}
  });
};

if(window.__APP_LOGIC__){Object.assign(window.__APP_LOGIC__,{
  caseSourceKeyCsv:caseSourceKeyCsv_,buildCaseServerRow:buildCaseServerRow_,buildCaseLocalRow:buildCaseLocalRow_,
  parseCaseCsvRows:parseCaseCsvRows_,validateCaseImportData65:validateCaseImportData65,
  fetchCaseServerKeysCsv:fetchCaseServerKeysCsv_,
  getCaseBlocked65:function(){return window._caseBlocked65||[]},
  commitCaseImportDirect:commitCaseImportDirect_,commitCaseImportViaQueue:commitCaseImportViaQueue_,
  opToRequests:opToRequests,
  findImportChunkRows65:findImportChunkRows65,retryImportChunk65:retryImportChunk65,
  persistFailedImportChunks65:persistFailedImportChunks65_
})}
</script>

<script>
/* ===== Round 6.8 fixes: defect B (form required groups) / defect C (test-send feedback) =====
   Design basis for B: DESIGN_V2 + FORM_TEAM_REPORT sec.6 -- the only required
   groups are (1) interested cases and (2) phone-available datetime; "anytime"
   satisfies (2). Everything else (experience / desired rate / free text) is
   optional. The form's own hint text says the same. Validation reuses
   formAnsweredSteps_(), the same semantics as the progress bar. */
function formRequiredCheckR68_(){
  var steps=null; try{steps=formAnsweredSteps_()}catch(e){}
  var caseDone=steps?!!steps.caseDone:!!document.querySelector(".fCase:checked");
  var phoneDone=steps?!!steps.phoneDone:false;
  var hasFormDom=!!(document.getElementById("fCallBlock")||document.querySelector(".fCase"));
  return {caseDone:caseDone,phoneDone:phoneDone,hasFormDom:hasFormDom};
}
function showFormRequiredNoticeR68_(chk){
  var miss=[];

  if(!chk.phoneDone)miss.push("お電話できる日時");

    if(bar&&bar.parentNode)bar.parentNode.insertBefore(n,bar);
    else if(bar)bar.appendChild(n);

  }
  var lines=miss.map(function(m){
    return m==="気になる案件"
      ? "・気になる案件を1つ以上選んでください"

  n.innerHTML="<b>まだ選ばれていない項目があります（送信はされていません）</b><br>"+lines;
  try{showToast("未選択の必須項目があります: "+miss.join(" / "),"warn")}catch(e){}
  try{
    var target=!chk.caseDone?(document.querySelector(".fCase")||n):(document.getElementById("fCallBlock")||n);
    if(target&&target.scrollIntoView)target.scrollIntoView({block:"center"});
  }catch(e){}
}
var _submitFormR68=submitForm;
submitForm=function(){
  var chk=formRequiredCheckR68_();
  if(chk.hasFormDom&&(!chk.caseDone||!chk.phoneDone)){ showFormRequiredNoticeR68_(chk); return; }
  var n=document.getElementById("formRequiredNotice"); if(n&&n.parentNode)n.parentNode.removeChild(n);
  return _submitFormR68();
};
/* Defect C (test send): the click always leaves a persistent result in
   #testMailResult (created delivery id / skip reason / error). Queue stats
   are refreshed at click time first, so a stale snapshot cannot silently
   block the click; the existing safety gates (send in progress / waiting
   production queue) still apply, but their reason is now shown persistently
   instead of only as a transient toast. */
function paintTestMailResultR68_(html){
  try{
    var el=document.getElementById("testMailResult");
    if(!el){ el=document.createElement("div"); el.id="testMailResult";
      var mp=document.getElementById("mailProg");
      if(mp&&mp.parentNode)mp.parentNode.insertBefore(el,mp.nextSibling);
      else{ var tbtn=null; try{tbtn=[].slice.call(document.querySelectorAll("button")).filter(function(b){return b.getAttribute&&b.getAttribute("onclick")==="testMail()"})[0]}catch(e){}
        if(tbtn&&tbtn.parentNode)tbtn.parentNode.insertBefore(el,tbtn.nextSibling);
        else{ var appEl=document.getElementById("app"); if(appEl)appEl.insertBefore(el,appEl.firstChild); else return; } } }
    el.innerHTML=html;
  }catch(e){}
}
var _testMailR68=testMail;
testMail=function(){
  paintTestMailResultR68_('<p class="small">テスト配信の作成を確認しています…</p>');
  var proceed=function(){
    var r;

<script>

/* --- 欠陥1: テスト送信は「成功/停止理由/エラー」のいずれかが必ず画面に残る ---

function paintTestMailR69_(kind,n){

/* バッチ送信の結果 (送信/除外/失敗) を結果表示欄へ写す。
   runSendBatches は _sendRun を作り直すため、監視フラグは独立に持つ。

var _apiCallR69=apiCall;

function r69TestWatchTap_(res){

      w.sent+=Number(res.sent||0); w.failed+=Number(res.failed||0); w.excl+=Number(res.skipped_excluded||0);

/* --- 欠陥2: outbox の破棄をアプリ内2段階確認にする ---
   従来はネイティブ confirm が承認できない環境では黙って戻り、1件も

var _discardOutboxR69=discardOutbox;

/* --- 項目4-3: 入口を旧アプリ式に再構成 ---
   入口 = 見出し → 県チップ → 件数行 → 大きな導線 (従来の基本構成は維持)。

   反映失敗バーと未送信操作カードが両方ある時だけ「要対応」1枚に寄せる。 */
function buildMorningCardHtmlR69_(){
  var s=respSummaryCalc();
  var synced=!!(window._respSync&&window._respSync.ok);
  var sm=synced?window._respSync.summary:null;
  if(sm&&typeof sm==="object"){var inner=(sm.summary&&typeof sm.summary==="object")?sm.summary:sm;
    if(typeof inner.notify_failed_count==="number")s.notify_failed_count=inner.notify_failed_count;
    if(typeof inner.phone_unparsed_count==="number")s.phone_unparsed_count=inner.phone_unparsed_count;
    if(typeof inner.sender_unknown_open_count==="number")s.sender_unknown_open_count=inner.sender_unknown_open_count;
    if(inner.sender_unknown_oldest!=null)s.sender_unknown_oldest=inner.sender_unknown_oldest}
  if(!s.open_count){
    if(!synced)return "";
    var hhmm="";var mm=String(window._respSync.at||"").match(/[T ](\d{2}):(\d{2})/);if(mm)hhmm=mm[1]+":"+mm[2];
    return '<div class="card" id="respMorningCard"><p>未対応の回答はありません（サーバー確認済み'+(hhmm?" "+hhmm:"")+'）</p></div>';
  }
  var ageDays=s.oldest_open?Math.max(0,Math.floor((new Date(todayStr())-new Date(String(s.oldest_open.at).slice(0,10)))/864e5)):0;
  return '<div class="card" id="respMorningCard" style="border:2px solid var(--warn)"><h3>未対応の回答（朝の棚卸し）</h3>'
    +"<p>未対応 "+s.unhandled+"件 ／ 対応中 "+s.in_progress+"件（未対応＋対応中 = "+s.open_count+"件）"
    +(s.oldest_open?" ／ 最古の未対応: "+esc(String(s.oldest_open.at).slice(0,10))+"（"+ageDays+"日放置）":"")+"</p>"
    +"<p>"
    +(s.phone_today_count?'<span class="badge bad">電話希望・本日対応 '+s.phone_today_count+"件</span> ":(s.phone_approaching?'<span class="badge warn">電話希望が接近しています'+(s.nearest_phone_hint?"（最接近 "+esc(s.nearest_phone_hint)+"）":"")+"</span> ":""))
    +(s.sender_unknown_open_count?'<span class="badge bad">送信元不明 '+s.sender_unknown_open_count+"件（引き取り待ち）</span> ":"")
    +(s.notify_failed_count?'<span class="badge bad">通知未達 '+s.notify_failed_count+"件（再送できます）</span> ":"")
    +(s.phone_unparsed_count?'<span class="badge warn">電話希望・日時未特定 '+s.phone_unparsed_count+"件</span> ":"")
    +(s.calendar_unregistered_count?'<span class="badge bad">カレンダー未登録 '+s.calendar_unregistered_count+"件</span>":"")
    +"</p>"
    +(synced?"":'<p class="small">未同期のため端末内の件数です</p>')
    +'<div class="flex"><a class="btn primary" href="#/responses">回答一覧（未対応タブ）を開く</a></div></div>';

var _viewHomeR69=viewHome;
viewHome=function(){
