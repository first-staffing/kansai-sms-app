function segmentOfCalc(a){/* R3 (T2): 終了系は statusStage の terminal 判定 (全種) を使って連絡停止にする (従来は接触NG・登録辞退の2種だけだった)。R3 検証 §1.1-6: 「退職済み」も statusStage が terminal と判定する (TERMINAL_CSV・サーバー csvStageRank_ と一致) */if(a.mail_optout||statusStage(a.csv_status).terminal||a.app_status==="NG"||a.app_status==="譲渡")return "連絡停止";if(a.csv_status==="稼働中"||a.app_status==="稼働開始")return "稼働中";if(["FIX待ち","アテンド待ち","職見待ち","内定待ち"].includes(a.csv_status)||["FIX","アテンド","内定"].includes(a.app_status))return "選考中";const d=a.desired_start_date;if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&(new Date(d)-new Date(new Date().toISOString().slice(0,10)))/864e5>60)return "時期先";if(!missingHearing(a).startsWith("ご登録の条件をもとに"))return "条件確認待ち";return "即提案可能"}
const SEGMENTS=["即提案可能","条件確認待ち","時期先","選考中","稼働中","連絡停止"];
/* R4 O-06: SMS不可の判定 (候補生成と同じ基準)。停止者は「見えるが送れない」が正しい姿 */
function isOptoutForSms(a){return !!a&&(a.mail_optout===true||segmentOf(a)==="連絡停止")}
function optoutSmsBadge(a){return '<span class="badge bad">'+(a&&a.mail_optout?"配信停止済みのためSMSは送れません":"連絡停止のためSMSは送れません")+'</span>'}
/* 入職希望日から逆算した連絡予定（追補7-3）: 60日前=状況確認 / 30日前=案件提案 / 14日前=選考状況確認。希望日未定は対象外 */
function contactSchedule(a){const d=a.desired_start_date;if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return[];const base=new Date(d);return [[60,"状況確認"],[30,"案件提案"],[14,"選考状況確認"]].map(([n,label])=>{const dt=new Date(base);dt.setDate(dt.getDate()-n);return {date:dt.toISOString().slice(0,10),label,daysBefore:n,start:d}})}
function todayStr(){var d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10)}
function dueTodayList(pool){const today=todayStr();const out=[];for(const a of pool){/* R4 10-#3: 終了系・配信停止・稼働中は理由を問わず入口で一括除外する (従来は14日理由だけ部分適用だった) */const seg=segmentOf(a);if(seg==="連絡停止"||seg==="稼働中")continue;const reasons=[];if(a.next_contact_date&&a.next_contact_date<=today)reasons.push("次回連絡日到来（"+a.next_contact_date+"）");for(const s of contactSchedule(a)){if(s.date<=today){const remain=Math.round((new Date(s.start)-new Date(today))/864e5);reasons.push(s.label+"：希望日まで"+remain+"日（予定日 "+s.date+"）")}}if(a.last_contact_at){const diff=Math.round((new Date(today)-new Date(a.last_contact_at))/864e5);if(diff>=14)reasons.push("前回接触から"+diff+"日")}if(reasons.length)out.push({a,reasons})}return out.sort((x,y)=>appliedAtStr(y.a).localeCompare(appliedAtStr(x.a)))}
/* ファネル集計: 本番は applicant_events の event_type(sms_sent/mail_sent/response_received/status_change) を掘り起こしコホートで数える設計。本モックはダミー集計 */
function funnel(pool){pool=nonTestApplicants(pool);const n=pool.length;const contacted=pool.filter(a=>a.sms_sent||a.last_contact_at).length;const replied=state.responses.filter(r=>pool.some(a=>a.id===r.applicant_id)).length;const pct=(v,base)=>base?Math.round(v/base*100):0;const rows=[["対象人数",n,100],["接触済み",contacted,pct(contacted,n)],["返信あり",replied,pct(replied,contacted)],["アテンド",pool.filter(a=>a.app_status==="アテンド"||a.csv_status==="アテンド待ち").length,0],["FIX",pool.filter(a=>a.csv_status==="FIX待ち"||a.app_status==="FIX").length,0],["内定",pool.filter(a=>a.csv_status==="内定待ち"||a.app_status==="内定").length,0],["稼働開始",pool.filter(a=>a.csv_status==="稼働中"||a.app_status==="稼働開始").length,0]];rows.forEach((r,i)=>{if(i>=3)r[2]=pct(r[1],contacted)});return rows.map(r=>[r[0]+"（前段比 "+r[2]+"%）",r[1]])}

function smsSnapshotFor(a,extra){

/* ===== R3: 永続化 / 進捗ステータス二層モデル（追補18・補正2） / D04-D09 / 追補17・19 / 磨きH系 ===== */
function showToast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.style.display="block";clearTimeout(showToast._tm);showToast._tm=setTimeout(()=>{t.style.display="none"},3000)}
function relDays(iso){if(!iso)return "";const d=Math.round((new Date(todayStr())-new Date(String(iso).slice(0,10)))/864e5);if(isNaN(d))return "";if(d===0)return "今日";if(d===1)return "昨日";if(d>1)return d+"日前";return ""}
/* ===== 差分永続化 (PERF対応・最重要): シードと同一のレコードは保存しない =====
   保存形式 v2: {v:2, mode:"diff"|"light", records:[...]}
   - diff: シードから変更されたレコード（派生フィールド除去済みの全項目）と、シードに無い追加レコードだけを保存。
   - light: 差分JSONが大きすぎる/保存失敗時のフォールバック。状態フィールドのみを保存し、画面に知らせる。
   復元は従来形式（全件配列）も読み、既存IDは上書き・新規IDは追加する従来挙動を維持する。 */
const _PERSIST_IGNORE={latest_application:1,furthest_status:1,terminal_status:1,has_fs_history:1,_seg:1,_segKey:1};
const _PERSIST_LIGHT_FIELDS=["id","sms_sent","mail_optout","optout_date","csv_status","app_status","last_contact_at","last_sms_at","sms_count","next_contact_date","work_task","form_filled_fields","form_filled_at","fs_status","qualifications","experience_years","nearest_station","desired_days","desired_slots","desired_start_date","new_application","events"];
const _PERSIST_DIFF_LIMIT=3500000; /* これを超える差分は軽量保存へ切り替える（localStorage上限 5-10MB 域への安全マージン） */
function _stableRecStr(a){try{return JSON.stringify(_cleanRec(a))}catch(e){return ""}}
function _cleanRec(a){const o={};Object.keys(a).forEach(k=>{if(!_PERSIST_IGNORE[k])o[k]=a[k]});return o}
function _lightRec(a){const o={};_PERSIST_LIGHT_FIELDS.forEach(k=>{if(a[k]!==undefined)o[k]=a[k]});return o}
const _seedRecStr={};applicants.forEach(a=>{_seedRecStr[a.id]=_stableRecStr(a)});
let _persistInfo={mode:"diff",records:0,chars:0,fallback:false};
let _lastPersistAt=0,_persistDirty=false,_persistTimer=null;
function persistApplicants(force){bumpDataVersion();const now=Date.now();
/* 集約: フォーム招待の発行など保存が短時間に連続する経路（描画中に1人あたり複数回呼ばれる）では、
   実保存は1回にまとめ、残りは末尾フラッシュで確実に保存する */
if(!force&&_lastPersistAt&&now-_lastPersistAt<1000){_persistDirty=true;if(!_persistTimer){_persistTimer=setTimeout(()=>{_persistTimer=null;if(_persistDirty)persistApplicants(true)},1000)}return true}
_lastPersistAt=now;_persistDirty=false;try{
  const diff=[];applicants.forEach(a=>{if(!a||!a.id)return;if(!Object.prototype.hasOwnProperty.call(_seedRecStr,a.id)||_seedRecStr[a.id]!==_stableRecStr(a))diff.push(_cleanRec(a))});
  const payload={v:2,mode:"diff",records:diff};
  const json=JSON.stringify(payload);
  if(json.length<=_PERSIST_DIFF_LIMIT&&LS.set("applicants_state",payload)){window._persistFallback=false;_persistInfo={mode:"diff",records:diff.length,chars:json.length,fallback:false};return true}
  /* フォールバック: 状態フィールドのみの軽量保存 */
  const light=applicants.map(a=>_lightRec(a));const lpayload={v:2,mode:"light",records:light};const ljson=JSON.stringify(lpayload);
  if(LS.set("applicants_state",lpayload)){window._persistFallback=true;_persistInfo={mode:"light",records:light.length,chars:ljson.length,fallback:true};try{showToast("保存容量が大きいため、状態のみの軽量保存に切り替えました")}catch(_){} return true}
  window._persistFallback=true;_persistInfo={mode:"failed",records:diff.length,chars:json.length,fallback:true};return false;
}catch(e){window._persistFallback=true;return false}}
(function restoreApplicants(){const saved=LS.get("applicants_state",null);const isEnv=saved&&!Array.isArray(saved)&&Array.isArray(saved.records);const list=Array.isArray(saved)?saved:(isEnv?saved.records:null);if(!Array.isArray(list)||!list.length)return;if(isEnv&&saved.mode==="light")window._persistFallback=true;const cur={};applicants.forEach(a=>cur[a.id]=a);list.forEach(s=>{if(!s||!s.id)return;const a=cur[s.id];if(a){Object.keys(s).forEach(k=>{a[k]=s[k]})}else if(s.name&&s.applied_at)applicants.push(s)});bumpDataVersion()})();
/* --- ステータス正規化: applicant-profile-shared.js の正規表現を移植し、ユーザー確定の8段へ寄せる --- */
function statusStage(raw){const s=String(raw||"").normalize("NFKC").replace(/\s/g,"").toUpperCase();if(!s)return{label:"",rank:0,terminal:false};
 if(s==="終了待ち")return{label:"終了待ち",rank:0,terminal:true};
 if(s==="応募除外")return{label:"応募除外",rank:0,terminal:true};
 if(/譲渡/.test(s))return{label:"譲渡",rank:0,terminal:true};
 if(/配信停止/.test(s))return{label:"配信停止",rank:0,terminal:true};
 if(/対象外/.test(s))return{label:"対象外",rank:0,terminal:true};
 if(/退職/.test(s))return{label:"退職済み",rank:0,terminal:true}; /* R3 検証 §1.1-6: TERMINAL_CSV・サーバー csvStageRank_ と揃える */
 if(/他社決定/.test(s))return{label:"他社決定",rank:0,terminal:true};
 if(/登録辞退/.test(s))return{label:"登録辞退",rank:0,terminal:true};
 if(/内定辞退/.test(s))return{label:"内定辞退",rank:0,terminal:true};
 if(/不通/.test(s))return{label:"不通",rank:0,terminal:true};
 if(/NG|キャンセル|辞退|終了|不採用|クローズ/.test(s)){const label=/接触/.test(s)?"接触NG":/誘致/.test(s)?"誘致NG":"選考NG";return{label,rank:0,terminal:true}}
 const stages={"接触待ち":10,"誘致待ち":20,"アテンド待ち":30,"FIX待ち":40,"職見待ち":50,"実施待ち":50,"内定待ち":60,"入職待ち":70,"稼働中":80};if(Object.prototype.hasOwnProperty.call(stages,s))return{label:s,rank:stages[s],terminal:false};
 if(/^(稼働済み|稼働中|入職済み|就業中|就業開始|稼働開始)$/.test(s))return{label:"稼働中",rank:80,terminal:false};
 if(/^(内定|内定済み|入職予定)$/.test(s))return{label:"入職待ち",rank:70,terminal:false};
 if(/^(FIX|FIX済み|FIX済)$/.test(s))return{label:"実施待ち",rank:50,terminal:false};
 if(/^(アテンド|アテンド済み|アテンド済)$/.test(s))return{label:"FIX待ち",rank:40,terminal:false};
 if(/^(誘致済み|誘致済)$/.test(s))return{label:"アテンド待ち",rank:30,terminal:false};
 if(/^(誘致待ち|誘致待)$/.test(s))return{label:"誘致待ち",rank:20,terminal:false};
 if(/^(接触|接触済み|接触済|連絡済み)$/.test(s))return{label:"接触待ち",rank:10,terminal:false};
 if(s==="未対応"||s==="退職済み"||s==="未来人材")return{label:s,rank:0,terminal:false,unclassified:true};
 if(s==="未設定"||s==="CSV未取り込み")return{label:s,rank:0,terminal:false};
 return{label:String(raw),rank:0,terminal:false,unclassified:true}}
function refreshProgress(a){const cands=[];(a.history||[]).forEach(h=>{if(h.status)cands.push({company:h.company||a.source_company,date:String(h.at||"").slice(0,10),status:h.status})});cands.push({company:a.source_company,date:String(a.applied_at||"").slice(0,10),status:a.csv_status});if(a.app_status)cands.push({company:a.source_company,date:String(a.last_contact_at||a.applied_at||"").slice(0,10),status:a.app_status});if(a.fs_status)cands.push({company:"ファーストスタッフィング",date:String(a.applied_at||"").slice(0,10),status:a.fs_status});
 let latest={company:normalizeCompany(a.source_company),date:String(a.applied_at||"").slice(0,10)};cands.forEach(c=>{if(c.date&&c.date>=latest.date)latest={company:normalizeCompany(c.company),date:c.date}});a.latest_application=latest;
 let best=null,term=null;cands.forEach(c=>{const st=statusStage(c.status);if(st.terminal){if(!term||c.date>=term.date)term={status:st.label,company:normalizeCompany(c.company),date:c.date}}else if(st.rank>0){if(!best||st.rank>best.rank)best={status:st.label,company:normalizeCompany(c.company),date:c.date,rank:st.rank}}});
 a.furthest_status=best||{status:"未対応",company:latest.company,date:latest.date,rank:10};a.terminal_status=term;
 if(a.history&&a.history.some(h=>normalizeCompany(h.company)==="ファーストスタッフィング"))a.has_fs_history=true;if(normalizeCompany(a.source_company)==="ファーストスタッフィング")a.has_fs_history=true;if(a.has_fs_history==null)a.has_fs_history=false;return a}
function refreshAllProgress(){applicants.forEach(a=>refreshProgress(a))}
function progressBadgeHtml(a){refreshProgress(a);const f=a.furthest_status;const t=a.terminal_status;const latestIsTerm=t&&a.latest_application&&t.company===a.latest_application.company&&t.date===a.latest_application.date;if(latestIsTerm)return `<span class="badge term">${esc(t.status)}</span>`;if(t)return `<span class="badge term">終了: ${esc(t.status)}</span> <span class="badge ok">${esc(f.status)}</span>`;return `<span class="badge ok">${esc(f.status)}</span>`}
function progressHtml(a){refreshProgress(a);const L=a.latest_application,f=a.furthest_status,t=a.terminal_status;return `<p class="small">応募：${esc(L.company)}｜${esc(L.date)}<br>最も進んだ状況：${esc(f.company)}｜${esc(f.status)}${t?`<br><span class="badge term">現在の終了状態：${esc(t.company)}｜${esc(t.status)}（${esc(t.date)}）</span>`:""}</p>`}
function responseBadgesHtml(a){const rs=state.responses.filter(r=>r.applicant_id===a.id);if(!rs.length)return "";const kinds=[...new Set(rs.map(r=>r.intent))];return `<div>${kinds.map(k=>`<span class="badge warn">回答種別: ${esc(k)}</span>`).join("")}</div>`}

function sortIdsByRecommendOrder(a,ids){try{if(!a)return ids;const ord=recommend(a,50).map(function(c){return c.id});const rank=function(id){const i=ord.indexOf(id);return i<0?9999:i};return [...ids].sort(function(x,y){return rank(x)-rank(y)})}catch(e){return ids}}
function toggleMultiCase(aid,cid,on){const cur=state.multiSel[aid]||[];if(on){if(cur.length>=3){alert("まとめて配信は最大3件です。");route();return}const a=applicants.find(x=>x.id===aid);state.multiSel[aid]=sortIdsByRecommendOrder(a,[...cur,cid])}else state.multiSel[aid]=cur.filter(x=>x!==cid);if(typeof _recHtmlCacheR2!=="undefined")_recHtmlCacheR2.clear();route()}
function multiJobSmsBody(a,cases){const lines=[smsRecipientName(a.name)+"様","","株式会社ファーストスタッフィングです。","ご希望に近い求人を"+cases.length+"件ご紹介します。"];cases.forEach((c,i)=>{const d=displayCase(c);lines.push("","【"+(i+1)+"】"+d.facility);const fc=SERVICE_FULL[facilityCode(d)]||facilityCode(d);if(fc&&fc!=="形態未確認")lines.push("施設形態："+fc);lines.push("勤務地："+d.address);lines.push("時給の目安："+publicSalaryBandText(c.job_type||a.job_type))});lines.push("",PUBLIC_SALARY_NOTE,"気になる求人の番号をご返信ください。","勤務時間や日数など、ご希望に合わせた働き方ができるよう、施設へ相談できます。","","最寄駅に合わせた求人もご案内できます。","最寄駅（路線・駅名）を教えてください。");return lines.join("\n")} // R3(#16): 時給は案件固有値でなく標準帯+注記
function sendMultiCases(aid){const a=applicants.find(x=>x.id===aid);const ids=(state.multiSel||{})[aid]||[];if(a&&isOptoutForSms(a)){showToast(a.mail_optout?"配信停止中のためSMSは送れません":"連絡停止のためSMSは送れません","bad");return}if(!a||!ids.length){alert("まとめて配信に選ぶで案件を選んでください（最大3件）");return}const cases=sortIdsByRecommendOrder(a,ids).map(id=>CASES.find(c=>c.id===id)).filter(Boolean).slice(0,3);const body=multiJobSmsBody(a,cases);const sz=smsSize(body);showModal(`<h3>まとめてSMS作成（${cases.length}件）</h3><p class="kv">${esc(body)}</p><p>${smsCountHtml("multi",body,cases.length)}</p><div class="flex"><a class="btn primary" href="${smsLink(a.phone,body,"multi",cases.length)}">SMS作成を開く</a><button onclick="markMultiSms('${a.id}')">送ったので記録する</button><button onclick="closeModal()">閉じる</button></div>`)}

function parsePhoneHint(text){
  var s=String(text||"");if(!s)return null;
  var base=todayStr();var by=Number(base.slice(0,4));
  function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31)return null;var dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;var pad=function(n){return String(n).padStart(2,"0")};return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
  function addDays(n){var dt=new Date(base);dt.setDate(dt.getDate()+n);var pad=function(x){return String(x).padStart(2,"0")};return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
  /* R4 04-11: evaluation order aligned to server (relative words first) */
  if(/\u660e\u5f8c\u65e5/.test(s))return addDays(2);if(/\u660e\u65e5/.test(s))return addDays(1);if(/\u4eca\u65e5|\u672c\u65e5/.test(s))return addDays(0);
  var m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(m)return mk(Number(m[1]),Number(m[2]),Number(m[3]));
  m=s.match(/(\d{1,2})\u6708(\d{1,2})\u65e5/);if(m){var r1=mk(by,Number(m[1]),Number(m[2]));if(r1&&r1<base&&Math.round((new Date(base)-new Date(r1))/864e5)>180)r1=mk(by+1,Number(m[1]),Number(m[2]));return r1}

var TERMINAL_CSV=["不通","選考NG","他社決定","登録辞退","応募除外","接触NG","対象外","退職済み"];

function brakeFor(a,now){if(!a)return {level:""};var me=currentOpName();now=now||new Date();var strong=null,weak=null;function consider(by,atIso,label,isClaim){if(!by||by===me)return;var hrs=(now-new Date(atIso))/36e5;if(isNaN(hrs))return;if(isClaim&&hrs<=24){strong=strong||{by:by,at:atIso,label:"対応中: "+by+"さん"}}else if(hrs<=72){strong=strong||{by:by,at:atIso,label:by+"さんが"+String(atIso).slice(5,10).replace("-","月")+"日に送信"}}else if(hrs<=24*7){weak=weak||{by:by,at:atIso,label:"最近の接触: "+by+"さん "+String(atIso).slice(5,10).replace("-","月")+"日"}}}state.responses.filter(function(r){return r.applicant_id===a.id}).forEach(function(r){if(respStatus(r)==="in_progress")consider(r.status_by||r.handled_by,r.status_at||r.at,"",true)});state.deliveries.filter(function(d){return d.applicant_id===a.id||(d.form_invite&&d.applicant_id===a.id)}).forEach(function(d){consider(d.sender_name,d.at,"",false)});(a.events||[]).forEach(function(e){if(e.actor){if(e.kind==="claim_start")consider(e.actor,e.at,"",true);else if(e.kind==="sms_sent"||e.kind==="mail_sent")consider(e.actor,e.at,"",false)}});if(strong)return {level:"strong",by:strong.by,at:strong.at,label:strong.label};if(weak)return {level:"weak",by:weak.by,at:weak.at,label:weak.label};return {level:""}}

function requestOptout_(){

      return apiCall({action:"registerOptout",form_token:tk}).then(function(){return {ok:true}}).catch(function(){return {ok:false}});

  };

  if(relayEnabled()){
    return relayOptout(tk).then(function(res){if(res&&res.ok)return res;return viaApi()}).catch(function(){return viaApi()});
  }
  return viaApi();
}
function optoutStateHtml_(state){

  if(state==="failed")return '<p style="font-size:16.5px">受付に失敗しました。お手数ですが、担当へご連絡ください。</p><button type="button" class="optoutBtn" onclick="optoutRun_()">もう一度試す</button>';
  if(state==="submitting")return '<button type="button" class="optoutBtn" disabled>送信中…</button>';
  if(state==="confirm2")return '<p>今後のご案内（メール・SMS）をすべて停止します。よろしいですか</p><button type="button" class="optoutBtn" onclick="optoutRun_()">停止する</button> <button type="button" class="optoutBtn" onclick="optoutCancel_()">やめる</button>';

function fmtQueueDateTime(v){

<script>
/* ===== R4 レーンD1 最終配線: お電話できる日時の一本化 + 見学希望日(複数) =====
   フォーム送信は中継 (relayLocalResponseFromDom -> buildRelayAnswers) と
   apiCall 直通 (submitForm -> opToRequests response_submit) の2経路がある。
   どちらの経路でも、送信直前に composeFormDom_() が DOM の値を一本化する:
   - 電話希望: #fCallDate + callSlot/callTiming チップ + #fPhone(補足) を
     buildCallDatetime_() で1文字列に合成し #fPhone へ戻す。面談希望日
     (#fInterview) は新規送信では使わない (値は空。サーバー側で互換読み)。
   - 見学希望日: #fTour/#fTour2/#fTour3 をカンマ連結して #fTour へ戻す
     (desired_tour_date はカンマ連結で複数保持する)。
   合成は表示ごとに1回だけ (window._formComposed)。両経路が同じ合成済み
   DOM 値を読むため、payload の phone_consult_datetime / desired_tour_date
   は経路間で一致する。 */
function buildCallDatetime_(parts){
  parts=parts||{};
  /* フォーム専用チーム (追補37): 新形式 = 日付(複数) × 時間帯(複数) + いつでも可。
     人間可読の1文字列に合成する (構造化データは phone_dates/phone_bands として別送)。 */
  if(Array.isArray(parts.dates)||Array.isArray(parts.bands)||parts.anytime!=null){
    var seenD={};var dates=(parts.dates||[]).filter(function(d){var s=String(d);if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||seenD[s])return false;seenD[s]=1;return true}).sort();
    var bands=PHONE_BAND_ORDER.filter(function(b){return (parts.bands||[]).indexOf(b)>=0});
    var noteN=String(parts.note||"").trim();
    var dl=dates.map(function(d){var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(d);var dt=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));var wd="日月火水木金土"[dt.getDay()];return Number(m[2])+"/"+Number(m[3])+"（"+wd+"）"});
    var bl=bands.map(function(b){return PHONE_BAND_LABEL[b]||b});
    var outN=[];
    if(dl.length)outN.push(dl.join("・"));
    if(bl.length)outN.push(bl.join("・"));
    if(parts.anytime)outN.push("いつでも可");
    if(noteN)outN.push(noteN);
    return outN.join(" ");
  }
  var out=[];
  var date=String(parts.date||"").trim();
  var slot=String(parts.slot||"").trim();
  var timing=String(parts.timing||"").trim();
  var note=String(parts.note||"").trim();
  if(date)out.push(date);
  if(slot)out.push(slot);
  if(timing&&timing!==slot)out.push(timing);
  if(note){
    var already=out.some(function(x){return note.indexOf(x)===0});
    if(!already||note!==out.join(" "))out.push(note);
  }

}
function tourDatesJoin_(values){
  var seen={};var out=[];
  (Array.isArray(values)?values:[]).forEach(function(v){
    var s=String(v||"").trim();
    if(!s)return;
    s.split(",").forEach(function(d){d=d.trim();if(d&&!seen[d]){seen[d]=1;out.push(d)}});
  });
  out.sort();
  return out.slice(0,3).join(",");
}
function composeFormDom_(){
  if(window._formComposed&&window._formComposedValues)return window._formComposedValues;
  var gv=function(id){var e=null;try{e=document.getElementById(id)}catch(_){e=null}return e?String(e.value||""):""};
  var result={phone_consult:gv("fPhone"),desired_tour_date:gv("fTour"),phone_dates:[],phone_bands:[],phone_anytime:false};

    }

      var ch=window._fChips||{};

      var fp=document.getElementById("fPhone");if(fp)fp.value=phone;
      result.phone_consult=phone;
    }
    if(document.getElementById("fTour2")||document.getElementById("fTour3")){
      var tours=tourDatesJoin_([gv("fTour"),gv("fTour2"),gv("fTour3")]);
      var ft=document.getElementById("fTour");if(ft)ft.value=tours;

<script>
/* ===== R4 レーンD1b 最終配線: 文面のサーバー正本同期 / プレビューサーバー生成 /
   SMSガード (残存タグ・kind別上限) / 初回SMS圧縮版 / テンプレ版の受け渡し /
   デモ用フォールバックの追随 (案件最大2件・番号案内はメールから外す・「（サンプル）」除去) ===== */

/* ---------- 初回SMS圧縮版 (sms_first_compact): デフォルトは init_sheets.gs のシード文面と一致 ---------- */
var SMS_FIRST_COMPACT_DEFAULT="{宛名}様\nご登録ありがとうございます。ファーストスタッフィングです！\n直近でお近くに案件が出たところです。フォームからご回答いただけます。\n{フォームURL}\n気になる案件があれば、まずはお電話で条件をすり合わせ、そのうえで法人へご提案し、先方の確認が取れましたら職場見学へ進みます。\nよければ、{不足項目名}も分かる項目だけで返信ください（未定は「相談」でOKです）。\nお電話できる日時：○月○日 ○時〜○時ごろ ※候補をいくつか教えていただけると幸いです。";
try{
  if(templates.sms_first_compact==null||templates.sms_first_compact==="")templates.sms_first_compact=SMS_FIRST_COMPACT_DEFAULT;
  var _cmInit=smsModes.find(function(m){return m.id==="registration_compact"});
  if(!_cmInit){smsModes.splice(1,0,{id:"registration_compact",title:"登録案内（圧縮版）",body:templates.sms_first_compact})}
  else if(_cmInit.body!==templates.sms_first_compact&&smsModes.indexOf(_cmInit)>=0){/* 編集済みモード本文は保持する */}
  LS.set("templates",templates);LS.set("smsModes",smsModes);
}catch(e){}

/* ---------- SMS上限: 圧縮版 320字 (レーンJ 項目3。最悪実測291字+宛名変動の余裕) ---------- */
SMS_LIMITS.first_compact=320;

/* ---------- 残存タグ検査と SMS ガード (13-#5 / 13-#4) ---------- */
function leftoverTags(body){
  var s=String(body||"");var out=[];var re=/\{[^}\n]{1,40}\}|［[^］]{1,30}］/g;var m;
  while((m=re.exec(s))){if(out.indexOf(m[0])<0)out.push(m[0])}
  return out;
}
var KNOWN_TAGS_FRONT=["{宛名}","{不足ヒヤリング}","{不足ヒアリング}","{不足項目名}","{フォームURL}","{回答フォームURL}","{配信停止URL}","{おすすめ案件}","{最寄り}","{希望条件}","{新着案件}","{担当者}"];
function unknownTags_(body){
  return leftoverTags(body).filter(function(t){return KNOWN_TAGS_FRONT.indexOf(t)<0});
}
/* guardSmsBody(body, kind, n): {ok, blocked, warn, check, leftovers, len, limit, over}
   - 残存タグがあれば常に blocked (リンク無効化)。
   - case / multi の上限超過は blocked (無効化)。first / first_compact / hard 系の超過は warn (警告+クリック時確認)。 */
function guardSmsBody(body,kind,n){
  var check=smsLimitCheck(kind||"hard",body,n);
  var leftovers=leftoverTags(body);
  var mustBlock=leftovers.length>0||((kind==="case"||kind==="multi")&&!check.ok);
  return {ok:!mustBlock,blocked:mustBlock,warn:!mustBlock&&!check.ok,check:check,leftovers:leftovers,len:check.len,limit:check.limit,over:check.over};
}
/* 保存時警告 (保存は可。送信時に停止する旨を案内する) */

  if(bad.length)alert("保存はできますが、次のタグは置換されず送信時に停止します: "+bad.join(" ")+"\nタグの綴りを確認してください（使えるタグ: "+KNOWN_TAGS_FRONT.join(" ")+"）");
  return bad;
}

/* ---------- {不足項目名}: 未確認ヒアリングの短縮名リスト (サーバー HEARING_SHORT_NAMES_ と同一表記) ---------- */
function missingHearingNames(a){
  if(!a)return "";

  if(!a.desired_start_date)names.push("勤務開始の希望日");
  if(!a.qualifications)names.push("資格");
  if(a.experience_years==null||a.experience_years==="")names.push("経験年数");
  if(!a.nearest_station)names.push("最寄駅");
  if(!a.desired_days)names.push("週の希望日数");
  if(!a.desired_slots)names.push("希望時間帯");
  return names.join("・");
}
var _personalizeD1b=personalize;
personalize=function(tpl,a){

try{

      app.insertBefore(d,app.firstChild);
    }
    if(!app.querySelector("[data-d2-today]")){
      var sc=(typeof respSummaryCalc==="function")?respSummaryCalc():{open_count:state.responses.filter(function(r){return !r.handled}).length};
      var due=(typeof dueTodayList==="function")?dueTodayList(digPool()):[];
      var card=document.createElement("div"); card.className="card"; card.setAttribute("data-d2-today","1"); card.setAttribute("data-home-slot","today");
      card.innerHTML="<h3>今日やること</h3><div class=\"rec\">回答未対応 <b>"+sc.open_count+'</b>件 <a class="btn primary" href="#/responses">回答一覧（未対応タブ）を開く</a></div><div class="rec">今日連絡 <b>'+due.length+"</b>名 "+due.slice(0,5).map(function(x){return esc(smsRecipientName(x.a.name))+" 様"}).join("、")+' <a href="#/dig">全員を見る（掘り起こしへ）</a></div>';
      var fail=app.querySelector(".opFailBar"); var qw=document.getElementById("queueWarning");
      var anchor=fail||(qw?qw.parentNode:null);
      if(anchor&&anchor.nextSibling)app.insertBefore(card,anchor.nextSibling); else app.insertBefore(card,app.firstChild);
    }
    var order=["queue","fail","today"];
    order.forEach(function(slot){ app.querySelectorAll('[data-home-slot="'+slot+'"]').forEach(function(el){ app.appendChild(el); }); });
    /* move ordered slots to front in order */
    var slots=order.map(function(slot){return app.querySelector('[data-home-slot="'+slot+'"]')}).filter(Boolean);
    for(var i=slots.length-1;i>=0;i--){ if(app.firstChild!==slots[i])app.insertBefore(slots[i],app.firstChild); }
  }catch(e){}
};

/* --- Route D2: anchor + focus restore (A8/A9), focus landing (H1), settings leave guard (J1) --- */
var _routeD2=route;
route=function(){
  try{
    var ae=document.activeElement, fk="";
    if(ae){ fk=ae.id?("#"+ae.id):(ae.getAttribute&&ae.getAttribute("data-fkey")?ae.getAttribute("data-fkey"):""); }
    window._focusBefore={key:fk,selStart:(ae&&ae.selectionStart!=null?ae.selectionStart:null),selEnd:(ae&&ae.selectionEnd!=null?ae.selectionEnd:null)};
    window._anchorBefore=null;
    var els=document.querySelectorAll("[data-anchor],[data-resp]");
    for(var i=0;i<els.length;i++){ var r=els[i].getBoundingClientRect(); if(r.bottom>88&&r.top<window.innerHeight){ window._anchorBefore={key:els[i].getAttribute("data-anchor")||("resp:"+els[i].getAttribute("data-resp")),top:r.top}; break; } }
  }catch(e){}
  try{
    var cur=location.hash||"#/";
    if(window._d2WasSettings&&cur.indexOf("#/settings")!==0&&window._settingsDirty&&Object.keys(window._settingsDirty).some(function(k){return window._settingsDirty[k]})){
      var secs=Object.keys(window._settingsDirty).filter(function(k){return window._settingsDirty[k]}).join("／");
      if(typeof confirm==="function"&&!confirm("未保存の変更があります（"+secs+"）。保存せずに移動しますか？")){ location.hash="#/settings"; return; }
      window._settingsDirty={};
    }
    window._d2WasSettings=(cur.indexOf("#/settings")===0);
  }catch(e){}
  try{ var _hNow=location.hash||"#/"; if(window._d2CompleteShown&&_hNow.indexOf("#/form")!==0&&_hNow.indexOf("#/responses")!==0)window._d2CompleteShown=false; }catch(e){}
  var prevHash=window._lastRouteHashD2||""; window._lastRouteHashD2=location.hash||"#/";
  _routeD2();
  try{
    if(window._d2FormJustSubmitted&&(location.hash||"").indexOf("#/responses")===0){
      window._d2FormJustSubmitted=false;
      window._d2CompleteShown=true;
      if(typeof showRelayComplete==="function")showRelayComplete();
      try{history.replaceState(null,"",window._d2FormHash||"#/form")}catch(e){}
    }
  }catch(e){}
  try{
    var same=(prevHash===(location.hash||"#/"));
    if(same){
      var an=window._anchorBefore;
      if(an){ var el=document.querySelector('[data-anchor="'+an.key+'"]')||document.querySelector('[data-resp="'+String(an.key).replace(/^resp:/,"")+'"]');
        if(el){ var dy=el.getBoundingClientRect().top-an.top; if(Math.abs(dy)>2&&Math.abs(dy)<window.innerHeight)window.scrollTo(0,window.scrollY+dy); } }
      var fb=window._focusBefore;
      if(fb&&fb.key){ var fe=fb.key.charAt(0)==="#"?document.getElementById(fb.key.slice(1)):document.querySelector('[data-fkey="'+fb.key+'"]');
        if(fe&&fe.focus){ fe.focus(); if(fb.selStart!=null&&fe.setSelectionRange){try{fe.setSelectionRange(fb.selStart,fb.selEnd)}catch(e){}} } }
    } else {
      var fm=(location.hash||"").match(/focus=([A-Za-z0-9_-]+)/);
      if(fm){ var fel=document.querySelector('[data-resp="'+fm[1]+'"]');
        if(fel){ var land=function(){try{fel.scrollIntoView({block:"center"})}catch(e){}}; if(typeof requestAnimationFrame==="function")requestAnimationFrame(function(){requestAnimationFrame(land)}); else land(); window._focusLanded=(window._focusLanded||0)+1; }
        else { var app=document.getElementById("app"); if(app)app.insertAdjacentHTML("afterbegin",'<div class="notice">指定された回答は現在の表示条件では見つかりませんでした</div>'); }
      }
    }
    paintBottomBars();
  }catch(e){}
};
